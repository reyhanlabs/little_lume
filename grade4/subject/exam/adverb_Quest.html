<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adverb Quest</title>
<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#2b2350;--p:#6c4cf1;--ok:#22b573;--bad:#ef4b5f;--soft:#efe9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1736;--card:#2a2450;--ink:#f4f0ff;--soft:#3a3270}}
:root[data-theme="dark"]{--bg:#1b1736;--card:#2a2450;--ink:#f4f0ff;--soft:#3a3270}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(108,76,241,.25);margin-bottom:14px;text-align:center}
h1{margin:4px 0;font-size:34px;color:var(--p)}
.big{font-size:64px;line-height:1.1}
.bar{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:10px}
.prog{height:12px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--p);transition:width .3s}
button{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;color:#fff;background:var(--p);box-shadow:0 5px 0 rgba(0,0,0,.25);width:100%;margin-top:10px}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:var(--soft);color:var(--ink);margin:0}
.opts button.ok,.tile.ok{background:var(--ok);color:#fff}
.opts button.no{background:var(--bad);color:#fff}
.sent{font-size:24px;font-weight:700;margin:10px 0}
.blank{display:inline-block;min-width:90px;border-bottom:4px dashed var(--p);color:var(--p)}
.days{display:flex;gap:5px;justify-content:center;margin:8px 0}
.days span{width:34px;padding:4px 0;border-radius:10px;background:var(--soft);font-size:11px}
.days span.on{background:#ffc83d;color:#3a2a00;font-weight:700}
.days b{display:block;font-size:16px}
.meter{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;align-items:center;font-weight:700}
.meter i{display:block;height:16px;border-radius:9px;background:linear-gradient(90deg,#ffc83d,#ff7a3d)}
.tray{min-height:58px;background:var(--soft);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tile{background:var(--card);color:var(--ink);border:3px solid var(--p);border-radius:12px;padding:6px 12px;font-size:20px;font-weight:700;width:auto;margin:0;box-shadow:0 3px 0 rgba(108,76,241,.4)}
.msg{min-height:30px;font-weight:700;font-size:20px;margin-top:8px}
.stars{font-size:46px}
</style></head><body><div id="app"></div>
<script>
const A=document.getElementById('app');
const W={always:7,usually:6,often:5,sometimes:3,rarely:1,never:0};
const Q=[
["🪥","Dina ___ brushes her teeth in the morning.","always"],
["🚌","Tom ___ goes to school by bus.","usually"],
["⚽","We ___ play football after school.","sometimes"],
["🦖","I ___ see dinosaurs at school.","never"],
["📚","She ___ reads a book before bed.","often"],
["🍕","They ___ eat pizza.","rarely"],
["🌅","The sun ___ rises in the east.","always"],
["🧹","Ben ___ cleans his room.","usually"]];
const S=["She always drinks milk","I never eat spicy food","Tom is often late","We sometimes play games","They usually walk to school","He rarely watches TV"];
const sh=a=>[...a].sort(()=>Math.random()-.5);
let score,hearts,i,round,built,pool,locked;
const hud=(t)=>`<div class="bar"><span>⭐ ${score}</span><span>${t}</span><span>${'❤️'.repeat(hearts)||'💔'}</span></div><div class="prog"><i style="width:${i/[0,Q.length,S.length,6,2,6][round]*100}%"></i></div>`;

function home(){score=0;hearts=3;i=0;
A.innerHTML=`<div class="card"><div class="big">🚀</div><h1>Adverb Quest</h1>
<p>Learn <b>adverbs of frequency</b> while you play! Collect stars ⭐, beat 5 levels and keep your 3 lives ❤️.</p></div>
<div class="card"><b>📏 Frequency Meter</b><p style="font-size:14px;margin:4px 0 10px">How often in 7 days?</p>
<div class="meter">${Object.entries(W).map(([k,v])=>`<span>${k}</span><i style="width:${Math.max(v/7*100,4)}%"></i>`).join('')}</div>
<p style="font-size:14px">Adverbs go <b>before the verb</b>: She <u>always</u> eats.<br>But <b>after am/is/are</b>: He <u>is</u> <u>often</u> late.</p></div>
<button onclick="startR1()">▶ Start Level 1</button>`}

function startR1(){round=1;i=0;pool=Q;next1()}
function days(n){return `<div class="days">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,k)=>`<span class="${k<n?'on':''}"><b>${k<n?'✔':'·'}</b>${d}</span>`).join('')}</div>`}
function next1(){
 if(i>=Q.length)return startR2();
 const q=Q[i],ans=q[2];locked=false;
 const o=sh([ans,...sh(Object.keys(W).filter(x=>x!=ans)).slice(0,3)]);
 A.innerHTML=hud('Level 1: Pick the Word')+`<div class="card"><div class="big">${q[0]}</div>${days(W[ans])}
 <div class="sent">${q[1].replace('___','<span class="blank" id="bl">&nbsp;</span>')}</div></div>
 <div class="opts">${o.map(x=>`<button onclick="pick(this,'${x}')">${x}</button>`).join('')}</div><div class="msg" id="m"></div>`}
function pick(b,x){if(locked)return;const ans=Q[i][2];
 if(x==ans){locked=true;b.classList.add('ok');score++;m.textContent='🎉 Correct!';bl.textContent=ans;i++;setTimeout(next1,1000)}
 else{b.classList.add('no');b.disabled=true;hearts--;m.textContent='😅 Try again! Look at the checked days.';
  if(!hearts){locked=true;setTimeout(end,900)}}}

function startR2(){round=2;i=0;score+=0;next2()}
function next2(){
 if(i>=S.length)return startR3();
 built=[];pool=sh(S[i].split(' '));draw2()}
function draw2(msg=''){
 A.innerHTML=hud('Level 2: Build the Sentence')+`<div class="card"><div class="big">🧩</div><p>Put the words in order to make a correct sentence!</p>
 <div class="tray">${built.map((w,k)=>`<button class="tile" onclick="rm(${k})">${w}</button>`).join('')}</div>
 <div class="tray" style="background:none">${pool.map((w,k)=>`<button class="tile" onclick="add(${k})">${w}</button>`).join('')}</div></div>
 <button onclick="chk()">✅ Check Answer</button><div class="msg">${msg}</div>`}
function add(k){built.push(pool.splice(k,1)[0]);draw2()}
function rm(k){pool.push(built.splice(k,1)[0]);draw2()}
function chk(){
 if(built.join(' ')==S[i]){score+=2;i++;draw2('🎉 Great job!');setTimeout(next2,900)}
 else{hearts--;if(!hearts)return end();pool=pool.concat(built);built=[];draw2('😅 Not quite. Remember where the adverb goes!')}}

/* LEVEL 3: Match Up */
let sel,done,L,Rr;
function startR3(){round=3;hearts=3;i=0;sel=null;done=[];L=sh(Object.keys(W));Rr=sh(L);draw3('❤️ Lives refilled!')}
function card(k,t){const d=done.includes(k),s=sel&&sel.k==k&&sel.t==t;
 return `<button class="tile ${d?'ok':''}" style="${s?'background:#ffc83d;color:#3a2a00':''}" ${d?'disabled':''} onclick="m3('${k}','${t}')">${t=='a'?k:W[k]+' / 7 days'}</button>`}
function draw3(msg=''){
 A.innerHTML=hud('Level 3: Match Up')+`<div class="card"><div class="big">🃏</div><p>Tap a word, then tap how many days it means!</p>
 <div class="opts"><div style="display:grid;gap:8px">${L.map(k=>card(k,'a')).join('')}</div><div style="display:grid;gap:8px">${Rr.map(k=>card(k,'d')).join('')}</div></div></div><div class="msg">${msg}</div>`}
function m3(k,t){
 if(!sel||sel.t==t){sel={k,t};return draw3()}
 if(sel.k==k){done.push(k);score++;i=done.length;sel=null;
  if(i==6){draw3('🎉 All matched!');return setTimeout(startR4,1000)}return draw3('🎉 Match!')}
 hearts--;sel=null;if(!hearts)return end();draw3('😅 Not a match. Try again!')}
/* LEVEL 4: Climb the Ladder */
const LD=[['never','rarely','sometimes','often','usually','always'],['never','sometimes','usually','always']];
let ord;
function startR4(){round=4;hearts=3;i=0;next4()}
function next4(){if(i>=2)return startR5();ord=[];pool=sh(LD[i]);draw4('❤️ Lives refilled!')}
function draw4(msg=''){
 A.innerHTML=hud('Level 4: Climb the Ladder')+`<div class="card"><div class="big">🪜</div><p>Tap the words from <b>0 days</b> (bottom) up to <b>7 days</b> (top)!</p>
 <div class="tray" style="flex-direction:column-reverse;align-items:center">${LD[i].map((_,k)=>`<div class="tile" style="width:70%;opacity:${ord[k]?1:.4}">${ord[k]||k+1}</div>`).join('')}</div>
 <div class="tray" style="background:none">${pool.map(w=>`<button class="tile" onclick="ld('${w}')">${w}</button>`).join('')}</div></div><div class="msg">${msg}</div>`}
function ld(w){
 if(w==LD[i][ord.length]){ord.push(w);pool=pool.filter(x=>x!=w);
  if(!pool.length){score+=3;draw4('🎉 Perfect!');i++;return setTimeout(next4,900)}return draw4()}
 hearts--;if(!hearts)return end();draw4('😅 Not that one! Which means fewer days?')}
/* LEVEL 5: Boss Battle */
const B=[["He is always happy.","He always is happy."],["I never eat spicy food.","I eat never spicy food."],["She sometimes plays chess.","She plays sometimes chess."],["We are usually late.","We usually are late."],["They often visit Grandma.","They visit often Grandma."],["Tom rarely walks to school.","Tom walks rarely to school."]];
let tm,tmr,bq;
function startR5(){round=5;hearts=3;i=0;next5()}
function next5(){clearInterval(tmr);if(i>=B.length)return end();
 locked=false;tm=10;bq=sh(B[i]);draw5();
 tmr=setInterval(()=>{tm--;const t=document.getElementById('tm');if(t)t.textContent='⏱ '+tm;if(tm<=0)hit(null)},1000)}
function draw5(){A.innerHTML=hud('Level 5: Boss Battle')+`<div class="card"><div class="big">🐲</div>
 <div class="prog"><i style="width:${(B.length-i)/B.length*100}%;background:var(--bad)"></i></div>
 <b id="tm">⏱ ${tm}</b><p>Beat the boss! Which sentence is correct?</p>
 <div style="display:grid;gap:10px">${bq.map(s=>`<button class="tile" style="padding:12px" onclick="hit('${s}')">${s}</button>`).join('')}</div></div><div class="msg" id="m"></div>`}
function hit(s){if(locked)return;locked=true;clearInterval(tmr);
 if(s==B[i][0]){score+=2;i++;m.textContent='💥 Direct hit!';setTimeout(next5,900)}
 else{hearts--;m.textContent=s===null?'⏰ Time is up!':'😅 The boss hits you!';setTimeout(hearts?next5:end,900)}}
function end(){clearInterval(tmr);
 const max=44,r=score/max,st=hearts>0&&r>.8?3:r>.5?2:1;
 A.innerHTML=`<div class="card"><div class="big">${hearts?'🏆':'💪'}</div><h1>${hearts?'Finished!':'Almost!'}</h1>
 <div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><p style="font-size:22px">Score: <b>${score}</b> / ${max}</p>
 <p>${st==3?'Amazing! You are an adverb star!':'Nice! Play again to get 3 stars.'}</p></div>
 <button onclick="home()">🔁 Play Again</button>`}
home();
</script></body></html>
