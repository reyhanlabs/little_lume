<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Littlelume English | Grade 4 – Tell More About Me (Lesson Book)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap');

:root{
  --mint:#BFF3E3; --mint-d:#8FE3C6;
  --pink:#FFD3E6; --pink-d:#FFA9CC;
  --sky:#C7E9FF; --sky-d:#93D2FF;
  --yellow:#FFEFB0; --yellow-d:#FFDD6B;
  --lav:#E3D9FF; --lav-d:#C7B4FF;
  --purple:#7C6FEA; --purple-d:#5F52C7;
  --ink:#3C3564; --ink-soft:#6B6390;
  --cream:#FFFBF3; --white:#FFFFFF;
  --shadow: 0 10px 30px rgba(92,74,158,.14);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; font-family:'Nunito',sans-serif; background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Baloo 2',cursive; color:var(--ink); margin:0 0 .4em;}
p{line-height:1.6;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--yellow-d);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ===== Top Bar & Nav ===== */
#topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,251,243,.9); backdrop-filter:blur(8px);
  border-bottom:2px solid var(--lav); display:flex; align-items:center; gap:14px; padding:10px 18px;
}
#topbar .logo{font-family:'Baloo 2'; font-weight:800; font-size:1.15rem; color:var(--purple-d); display:flex; align-items:center; gap:8px; white-space:nowrap;}
#topbar .logo .dot{width:14px;height:14px;border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, var(--yellow-d) 60%, var(--purple)); box-shadow:0 0 8px var(--yellow-d);}
#progress-wrap{flex:1; height:14px; background:var(--lav); border-radius:20px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.08);}
#progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--mint-d),var(--sky-d),var(--pink-d)); border-radius:20px; transition:width .5s ease;}
#progress-label{font-size:.75rem; font-weight:800; color:var(--purple-d); white-space:nowrap;}
#menu-toggle{display:none; background:var(--lav); border:none; border-radius:10px; padding:8px 10px; font-size:1.1rem;}

#shell{display:flex; max-width:1400px; margin:0 auto;}
#sidenav{
  width:230px; flex-shrink:0; padding:18px 10px; position:sticky; top:58px; align-self:flex-start;
  max-height:calc(100vh - 58px); overflow-y:auto;
}
#sidenav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  padding:10px 12px; border-radius:12px; font-weight:700; color:var(--ink-soft); font-size:.86rem; margin-bottom:2px;
  transition:background .2s, color .2s, transform .15s;
}
#sidenav button .num{
  width:22px;height:22px;border-radius:50%;background:var(--lav);color:var(--purple-d);font-size:.7rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Baloo 2';
}
#sidenav button:hover{background:var(--lav); transform:translateX(3px);}
#sidenav button.active{background:var(--purple); color:#fff;}
#sidenav button.active .num{background:#fff; color:var(--purple-d);}
#sidenav button.done .num::after{content:'✓'; }
#sidenav button.done .num{background:var(--mint-d); color:#fff; font-size:0;}
#sidenav button.done .num::before{content:'✓'; font-size:.75rem;}

main{flex:1; min-width:0; padding:20px 26px 80px;}

/* ===== Mascot ===== */
#mascot-wrap{
  position:fixed; right:18px; bottom:18px; z-index:60; display:flex; align-items:flex-end; gap:10px; max-width:290px;
}
#mascot-bubble{
  background:#fff; border-radius:18px 18px 4px 18px; padding:12px 14px; box-shadow:var(--shadow); font-size:.82rem;
  font-weight:700; color:var(--ink); border:2px solid var(--lav); display:none;
}
#mascot-bubble.show{display:block; animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.8); opacity:0;} to{transform:scale(1); opacity:1;}}
#lumi{
  width:56px; height:56px; border-radius:50%; flex-shrink:0; position:relative; cursor:pointer;
  background:radial-gradient(circle at 32% 30%, #fff, var(--yellow-d) 55%, var(--purple) 100%);
  box-shadow:0 0 18px 4px rgba(255,221,107,.7), var(--shadow);
  animation:float 3s ease-in-out infinite;
}
#lumi::before,#lumi::after{
  content:''; position:absolute; top:14px; width:20px; height:14px; background:rgba(255,255,255,.55); border-radius:50% 50% 50% 0;
}
#lumi::before{left:-12px; transform:rotate(-20deg);}
#lumi::after{right:-12px; transform:scaleX(-1) rotate(-20deg);}
@keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);}}

/* ===== Sections / Cards ===== */
.page{display:none; animation:fadein .4s ease;}
.page.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{display:inline-block; font-family:'Baloo 2'; font-weight:700; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--purple-d); background:var(--lav); padding:5px 12px; border-radius:20px; margin-bottom:10px;}
.section-title{font-size:1.9rem; margin-bottom:6px;}
.section-sub{color:var(--ink-soft); font-weight:700; margin-bottom:22px;}

.card{background:#fff; border-radius:22px; box-shadow:var(--shadow); padding:22px; border:2px solid rgba(199,180,255,.35);}
.grid{display:grid; gap:16px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.tile{border-radius:20px; padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .2s;}
.tile:hover{transform:translateY(-4px);}
.tile.mint{background:var(--mint);} .tile.pink{background:var(--pink);} .tile.sky{background:var(--sky);}
.tile.yellow{background:var(--yellow);} .tile.lav{background:var(--lav);}
.tile .emoji{font-size:2.1rem;}
.tile h4{margin:8px 0 4px; font-size:1.05rem;}

.btn{
  display:inline-flex; align-items:center; gap:8px; font-family:'Baloo 2'; font-weight:700; font-size:.95rem;
  border:none; border-radius:16px; padding:12px 22px; color:#fff; background:var(--purple); box-shadow:0 6px 0 var(--purple-d);
  transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(2px); box-shadow:0 3px 0 var(--purple-d);}
.btn.secondary{background:#fff; color:var(--purple-d); box-shadow:0 6px 0 var(--lav); border:2px solid var(--lav);}
.btn.small{padding:8px 16px; font-size:.8rem; box-shadow:0 4px 0 var(--purple-d);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.nav-controls{display:flex; justify-content:space-between; margin-top:34px; gap:10px; flex-wrap:wrap;}

/* Flip cards for vocab */
.flip-outer{perspective:1200px; height:210px;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; cursor:pointer;}
.flip-outer.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:20px; padding:16px; display:flex; flex-direction:column; justify-content:center; box-shadow:var(--shadow);}
.flip-front{background:var(--sky);}
.flip-back{background:var(--white); border:2px solid var(--sky-d); transform:rotateY(180deg); font-size:.85rem;}
.flip-front .emoji{font-size:2.4rem; display:block; margin-bottom:6px;}
.hint{font-size:.7rem; color:var(--ink-soft); position:absolute; bottom:8px; right:12px;}

/* fill-blank inputs */
input.blank, input.text-in{
  border:none; border-bottom:3px solid var(--purple); background:var(--lav); border-radius:8px 8px 0 0;
  padding:6px 10px; font-family:'Nunito'; font-weight:800; font-size:1rem; color:var(--purple-d); width:150px; text-align:center;
}
input.blank:focus, input.text-in:focus{outline:none; background:var(--yellow);}

.example-box{background:var(--mint); border-radius:16px; padding:14px 18px; margin:10px 0; font-weight:700;}
.pattern-box{border-left:6px solid var(--purple); background:var(--lav); border-radius:0 18px 18px 0; padding:18px 20px; margin-bottom:18px;}
.speaking-tag{display:inline-flex; align-items:center; gap:6px; background:var(--pink); border-radius:20px; padding:6px 14px; font-weight:800; font-size:.78rem; margin-top:10px;}

.quiz-q{margin-bottom:20px; padding-bottom:18px; border-bottom:2px dashed var(--lav);}
.quiz-q:last-child{border-bottom:none;}
.opt{display:block; width:100%; text-align:left; background:var(--sky); border:2px solid transparent; border-radius:14px; padding:10px 14px; margin-bottom:8px; font-weight:700;}
.opt.correct{background:var(--mint-d); border-color:#3fae86;}
.opt.wrong{background:var(--pink-d); border-color:#e0578e;}
.opt:disabled{cursor:default;}
#quiz-result, #miniquiz-result, #finalquiz-result{font-weight:800; margin-top:10px;}

/* dialogue */
.dialogue-card{margin-bottom:24px;}
.line{display:flex; gap:10px; margin-bottom:10px; align-items:flex-start;}
.line .who{flex-shrink:0; font-family:'Baloo 2'; font-weight:700; background:var(--purple); color:#fff; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:.85rem;}
.line.b .who{background:var(--pink-d);}
.line p{background:var(--cream); border-radius:14px; padding:8px 14px; margin:0; flex:1;}
.note{font-size:.75rem; color:var(--ink-soft); font-style:italic;}

/* checklist */
.checklist label{display:flex; align-items:center; gap:10px; padding:10px 4px; font-weight:700; cursor:pointer;}
.checklist input{width:20px; height:20px; accent-color:var(--purple);}

/* Teacher notes */
.teacher-note{background:#FFF7E0; border:2px dashed var(--yellow-d); border-radius:14px; padding:10px 16px 6px; margin-bottom:20px; font-size:.82rem; color:var(--ink-soft);}
.teacher-note summary{cursor:pointer; font-weight:800; color:var(--purple-d); font-family:'Baloo 2'; font-size:.88rem; list-style:none;}
.teacher-note summary::-webkit-details-marker{display:none;}
.teacher-note summary::before{content:'▸ ';}
.teacher-note[open] summary::before{content:'▾ ';}
.teacher-note p{margin:8px 0;}

/* Grade badge */
.grade-badge{background:var(--purple); color:#fff; font-size:.66rem; font-weight:800; padding:3px 10px; border-radius:20px; font-family:'Baloo 2';}
.badge-adv{position:absolute; top:8px; right:10px; background:var(--purple); color:#fff; font-size:.58rem; font-weight:800; padding:3px 8px; border-radius:10px; z-index:2;}

/* Listening / Reading / Writing */
.audio-card{text-align:center;}
.reading-passage{font-size:1.05rem; line-height:1.9;}
#writing-box{width:100%; border:3px solid var(--lav); border-radius:16px; padding:14px; font-family:'Nunito'; font-size:1rem; resize:vertical;}
#writing-box:focus{outline:none; border-color:var(--purple);}

/* Games */
.game-nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
.game-nav button{background:var(--white); border:2px solid var(--lav); border-radius:14px; padding:9px 15px; font-weight:800; font-size:.82rem; color:var(--ink-soft);}
.game-nav button.active{background:var(--purple); color:#fff; border-color:var(--purple);}
.game-panel{display:none;}
.game-panel.active{display:block;}

.match-col{display:flex; flex-direction:column; gap:10px;}
.match-item{background:var(--white); border:2px solid var(--sky-d); border-radius:14px; padding:10px 14px; font-weight:800; text-align:center;}
.match-item.selected{background:var(--yellow);}
.match-item.matched{background:var(--mint-d); color:#fff; border-color:#3fae86;}

.mem-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.mem-card{aspect-ratio:1/1; border-radius:14px; background:var(--purple); display:flex; align-items:center; justify-content:center; font-size:1.6rem; cursor:pointer; box-shadow:var(--shadow);}
.mem-card.flipped{background:var(--white); border:2px solid var(--purple);}
.mem-card.matched{background:var(--mint-d); opacity:.6; cursor:default;}

#ws-grid{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; max-width:420px; margin:0 auto 14px;}
.ws-cell{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; background:var(--white); border:2px solid var(--lav); border-radius:6px; font-weight:800; font-size:.8rem; cursor:pointer; user-select:none;}
.ws-cell.sel{background:var(--yellow);}
.ws-cell.found{background:var(--mint-d); color:#fff;}
#ws-words{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.ws-word{background:var(--sky); border-radius:20px; padding:5px 12px; font-weight:800; font-size:.78rem;}
.ws-word.found{background:var(--mint-d); color:#fff; text-decoration:line-through;}

#wheel-wrap{display:flex; flex-direction:column; align-items:center; gap:16px;}
#wheel{width:280px; height:280px; border-radius:50%; position:relative; transition:transform 3.5s cubic-bezier(.17,.67,.32,1.28); box-shadow:var(--shadow); border:6px solid #fff;}
#wheel-pointer{position:absolute; top:-4px; left:50%; transform:translateX(-50%); font-size:1.6rem;}

.sb-chip{display:inline-block; background:var(--purple); color:#fff; font-weight:800; padding:8px 14px; border-radius:12px; margin:4px; cursor:pointer;}
#sb-answer{min-height:52px; border:3px dashed var(--lav); border-radius:14px; padding:10px; margin-bottom:14px; display:flex; flex-wrap:wrap; align-items:center;}
#sb-bank{min-height:52px;}

/* drag drop */
.dd-target{display:inline-flex; align-items:center; gap:6px; min-width:120px; min-height:38px; background:var(--cream); border:3px dashed var(--purple); border-radius:12px; padding:4px 10px; vertical-align:middle;}
.dd-target.filled{border-style:solid; background:var(--mint);}
.dd-source{display:inline-block; background:var(--pink-d); color:#fff; font-weight:800; padding:8px 14px; border-radius:12px; margin:5px; cursor:grab;}
.dd-source.used{opacity:.3; pointer-events:none;}

/* Certificate */
#cert{
  background:linear-gradient(135deg,#fff, var(--lav) 150%); border:10px solid var(--yellow-d); border-radius:26px;
  padding:44px; text-align:center; position:relative; max-width:760px; margin:0 auto;
}
#cert::before,#cert::after{content:'⭐'; position:absolute; font-size:1.6rem; top:16px;}
#cert::before{left:20px;} #cert::after{right:20px;}
#cert .medal{font-size:3.2rem;}
#cert h2{font-size:2.1rem; margin:6px 0;}
#cert .name-line{font-family:'Baloo 2'; font-size:1.6rem; color:var(--purple-d); border-bottom:3px solid var(--purple); display:inline-block; padding:0 20px 4px; min-width:260px;}

footer.brand-foot{text-align:center; padding:30px; color:var(--ink-soft); font-weight:800; font-size:.8rem;}

/* confetti canvas */
#confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:999;}

/* Cover */
#page-cover{text-align:center; padding-top:20px;}
.cover-illust{font-size:5rem; margin:14px 0;}
.cover-badges{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:16px 0 26px;}
.cover-badges span{background:var(--white); border:2px solid var(--lav); border-radius:20px; padding:7px 16px; font-weight:800; font-size:.8rem; color:var(--purple-d);}
.tagline{font-family:'Baloo 2'; font-weight:700; letter-spacing:.04em; color:var(--purple-d); font-size:1rem;}

@media(max-width:840px){
  #sidenav{position:fixed; top:56px; left:0; bottom:0; background:var(--cream); z-index:40; box-shadow:6px 0 20px rgba(0,0,0,.08); transform:translateX(-105%); transition:transform .3s; width:240px;}
  #sidenav.open{transform:translateX(0);}
  #menu-toggle{display:block;}
  main{padding:16px;}
}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div id="topbar">
  <button id="menu-toggle">☰</button>
  <div class="logo"><span class="dot"></span>Littlelume English <span class="grade-badge">Grade 4</span></div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="progress-label">0% complete</div>
</div>

<div id="shell">
  <nav id="sidenav"></nav>
  <main id="main"></main>
</div>

<div id="mascot-wrap">
  <div id="mascot-bubble"></div>
  <div id="lumi" title="Hi! I'm Lumi!"></div>

<footer class="brand-foot">✨ Littlelume English — Learn • Play • Shine ✨</footer>

let currentIndex = 0;
const completed = new Set();

/* =========================================================
   BUILD NAV
========================================================= */
const sidenav = document.getElementById('sidenav');
SECTIONS.forEach((s,i)=>{
  const b = document.createElement('button');
  b.innerHTML = `<span class="num">${i}</span><span>${s.label}</span>`;
  b.addEventListener('click', ()=>goTo(i));
  b.dataset.idx = i;
  sidenav.appendChild(b);
});

document.getElementById('menu-toggle').addEventListener('click', ()=> sidenav.classList.toggle('open'));

function updateNav(){
  [...sidenav.children].forEach((b,i)=>{
    b.classList.toggle('active', i===currentIndex);
    b.classList.toggle('done', completed.has(i));
  });
  const pct = Math.round((completed.size / SECTIONS.length)*100);
  document.getElementById('progress-bar').style.width = pct+'%';
  document.getElementById('progress-label').textContent = pct+'% complete';
}

function goTo(i){
  currentIndex = i;
  completed.add(i>0? i-1 : 0);
  if(i===SECTIONS.length-1){ SECTIONS.forEach((s,idx)=>completed.add(idx)); }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+SECTIONS[i].id).classList.add('active');
  updateNav();
  window.scrollTo({top:0, behavior:'smooth'});
  sidenav.classList.remove('open');
  showMascot(MASCOT_TIPS[SECTIONS[i].id]);
}

function navButtons(id){
  const i = SECTIONS.findIndex(s=>s.id===id);
  const prev = i>0 ? `<button class="btn secondary" onclick="goTo(${i-1})">⬅ Back</button>` : `<span></span>`;
  const next = i<SECTIONS.length-1 ? `<button class="btn" onclick="goTo(${i+1})">Next ➡</button>` : `<span></span>`;
  return `<div class="nav-controls">${prev}${next}</div>`;
}

const bubble = document.getElementById('mascot-bubble');

  bubble.textContent = text;
  bubble.classList.add('show');

/* =========================================================
   TEXT-TO-SPEECH (LISTENING AUDIO)
========================================================= */
function speakText(text, btn){
  if(!('speechSynthesis' in window)){
    alert("Sorry, audio playback isn't supported in this browser. Please use the transcript below instead.");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.85; utter.pitch = 1.05; utter.lang = 'en-US';
  if(btn){
    btn.disabled = true; const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = '🔊 Playing...';
    utter.onend = ()=>{ btn.disabled=false; btn.textContent = '🔁 Listen Again'; };
    utter.onerror = ()=>{ btn.disabled=false; btn.textContent = original; };
  }
  window.speechSynthesis.speak(utter);
}

const cCanvas = document.getElementById('confetti-canvas');
const cCtx = cCanvas.getContext('2d');
function resizeCanvas(){cCanvas.width=innerWidth; cCanvas.height=innerHeight;}
resizeCanvas(); addEventListener('resize', resizeCanvas);
function confettiBurst(){
  const colors = ['#FFD3E6','#BFF3E3','#C7E9FF','#FFEFB0','#E3D9FF','#7C6FEA'];
  const pieces = Array.from({length:120}, ()=>({
    x: Math.random()*cCanvas.width, y: -20 - Math.random()*200,
    r: 4+Math.random()*5, c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2+Math.random()*3, vx: -2+Math.random()*4, rot: Math.random()*360, vr:-6+Math.random()*12
  }));
  let frame=0;
  function anim(){
    frame++;
    cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      cCtx.save(); cCtx.translate(p.x,p.y); cCtx.rotate(p.rot*Math.PI/180);
      cCtx.fillStyle=p.c; cCtx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      cCtx.restore();
    });
    if(frame<130) requestAnimationFrame(anim); else cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
  }
  anim();
}

window.runQuiz = function(data, containerId, resultId){
  const c = document.getElementById(containerId);
  if(!c.querySelector('.opt')){ // build first time
    c.innerHTML = data.map((q,i)=>`
      <div class="quiz-q" data-i="${i}">
        <p><strong>${i+1}. ${q.q}</strong></p>
        ${q.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}
      </div>`).join('');
    c.querySelectorAll('.quiz-q').forEach((qEl,i)=>{
      qEl.querySelectorAll('.opt').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(qEl.dataset.answered) return;
          qEl.dataset.answered='1';
          const j=+btn.dataset.j;
          qEl.querySelectorAll('.opt').forEach(b=>b.disabled=true);
          if(j===data[i].correct){btn.classList.add('correct');}
          else{btn.classList.add('wrong'); qEl.querySelectorAll('.opt')[data[i].correct].classList.add('correct');}
        });
      });
    });
    document.getElementById(resultId).textContent='Answer all questions, then tap "Check My Answers" again!';
    return;
  }
  const score = [...c.querySelectorAll('.quiz-q')].filter(qEl=>{
    const wrongPicked = qEl.querySelector('.opt.wrong');
    return qEl.dataset.answered && !wrongPicked;
  }).length;
  const answeredCount = [...c.querySelectorAll('.quiz-q')].filter(q=>q.dataset.answered).length;
  const resEl = document.getElementById(resultId);
  if(answeredCount < data.length){
    resEl.textContent = `You answered ${answeredCount}/${data.length}. Please answer every question!`;
    return;
  }
  resEl.textContent = `🎉 Great job! You scored ${score} / ${data.length}!`;
  if(score >= Math.ceil(data.length*0.6)) confettiBurst();
};

function buildMatchGame(leftArr, rightArr, correctPairs, leftId, rightId, resultId){
  const leftEl = document.getElementById(leftId), rightEl = document.getElementById(rightId);
  leftEl.innerHTML=''; rightEl.innerHTML='';
  let selectedLeft=null, matchedCount=0;
  leftArr.forEach(txt=>{
    const d=document.createElement('div'); d.className='match-item'; d.textContent=txt;
    d.addEventListener('click', ()=>{
      if(d.classList.contains('matched')) return;
      leftEl.querySelectorAll('.match-item').forEach(i=>i.classList.remove('selected'));
      d.classList.add('selected'); selectedLeft=d;
    });
    leftEl.appendChild(d);
  });
  rightArr.forEach(txt=>{
    const d=document.createElement('div'); d.className='match-item'; d.textContent=txt;
    d.addEventListener('click', ()=>{
      if(d.classList.contains('matched') || !selectedLeft) return;
      const pair = correctPairs.find(p=>p[0]===selectedLeft.textContent);
      if(pair && pair[1]===txt){
        selectedLeft.classList.remove('selected'); selectedLeft.classList.add('matched');
        d.classList.add('matched'); matchedCount++;
        document.getElementById(resultId).textContent = matchedCount===correctPairs.length ? '🎉 All matched! Great job!' : `${matchedCount}/${correctPairs.length} matched`;
        if(matchedCount===correctPairs.length) confettiBurst();
      } else {
        d.classList.add('wrong'); setTimeout(()=>d.classList.remove('wrong'),500);
      }
      selectedLeft=null;
    });
    rightEl.appendChild(d);
  });
}

/* --- Word Search --- */
function initWordSearch(){
  const words = ['READING','DRAWING','SINGING','DANCING','GAMING','CYCLING'];
  const size=10;
  let grid = Array.from({length:size},()=>Array(size).fill(''));
  const dirs=[[0,1],[1,0]];
  words.forEach(w=>{
    let placed=false, tries=0;
    while(!placed && tries<200){
      tries++;
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      const r0 = Math.floor(Math.random()*(size - (dir[0]?w.length:0)));
      const c0 = Math.floor(Math.random()*(size - (dir[1]?w.length:0)));
      let ok=true;
      for(let k=0;k<w.length;k++){
        const r=r0+dir[0]*k, c=c0+dir[1]*k;
        if(grid[r][c] && grid[r][c]!==w[k]){ ok=false; break; }
      }
      if(ok){
        for(let k=0;k<w.length;k++){ const r=r0+dir[0]*k,c=c0+dir[1]*k; grid[r][c]=w[k]; }
        placed=true;
      }
    }
  });
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*26)];

  const wsGrid = document.getElementById('ws-grid');
  wsGrid.innerHTML='';
  let selecting=false, selCells=[];
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    const cell=document.createElement('div'); cell.className='ws-cell'; cell.textContent=grid[r][c];
    cell.dataset.r=r; cell.dataset.c=c;
    cell.addEventListener('click', ()=>{
      cell.classList.toggle('sel');
      if(cell.classList.contains('sel')) selCells.push(cell); else selCells=selCells.filter(x=>x!==cell);
      const word = selCells.map(x=>x.textContent).join('');
      const wordRev = [...word].reverse().join('');
      const found = words.find(w=> (w===word || w===wordRev) && !w._done);
      if(found){
        selCells.forEach(x=>{x.classList.remove('sel'); x.classList.add('found');});
        found._done=true; selCells=[];
        document.querySelectorAll('.ws-word').forEach(w=>{ if(w.textContent===found) w.classList.add('found'); });
        if(words.every(w=>w._done)) confettiBurst();
      }
    });
    wsGrid.appendChild(cell);
  }
  document.getElementById('ws-words').innerHTML = words.map(w=>`<span class="ws-word">${w}</span>`).join('');
}

    });

  });
}

/* --- Spin the Wheel --- */
let wheelRotation=0;
function drawWheel(){
  const canvas=document.getElementById('wheel'); const ctx=canvas.getContext('2d');
  const colors=['#BFF3E3','#FFD3E6','#C7E9FF','#FFEFB0','#E3D9FF','#FFA9CC'];
  const n=SPEAKING_Q.length, R=140;
  ctx.clearRect(0,0,280,280);
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI, a1=((i+1)/n)*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(140,140); ctx.arc(140,140,R,a0,a1); ctx.closePath();
    ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    ctx.save(); ctx.translate(140,140); ctx.rotate((a0+a1)/2);
    ctx.fillStyle='#3C3564'; ctx.font='bold 11px Nunito'; ctx.textAlign='right';
    ctx.fillText((i+1)+'', R-10, 4);
    ctx.restore();
  }
}
function spinWheel(){
  const n=SPEAKING_Q.length;
  const extra = 360*4 + Math.random()*360;
  wheelRotation += extra;
  const canvas=document.getElementById('wheel');
  canvas.style.transform = `rotate(${wheelRotation}deg)`;
  setTimeout(()=>{
    const norm = (360 - (wheelRotation % 360)) % 360;
    const idx = Math.floor(norm / (360/n)) % n;
    document.getElementById('wheel-result').textContent = '🎯 ' + SPEAKING_Q[idx].q;
    confettiBurst();
  }, 3600);
}

  const sentences = (text.match(/[.!?]+/g) || []).length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const el = document.getElementById('writing-count');
  el.textContent = `${sentences} sentence${sentences===1?'':'s'} · ${words} word${words===1?'':'s'}`;
  if(sentences>=6 && sentences<=8){
    el.style.color = '#3fae86';
    completed.add(SECTIONS.findIndex(s=>s.id==='writing'));
    updateNav();
  } else {
    el.style.color = 'var(--purple-d)';
  }
}

/* =========================================================
   CHALLENGE CHECKLIST
========================================================= */
function checkChallenge(){
  const boxes = document.querySelectorAll('#page-challenge .chk');
  const allChecked = [...boxes].every(b=>b.checked);
  const msg = document.getElementById('challenge-msg');
  if(allChecked){
    msg.textContent = '🌟 Amazing! You are ready to present. Go shine!';
    confettiBurst();
  } else {
    msg.textContent = 'Check every box when you feel ready! You can do it 💪';
  }
}

/* =========================================================
   CERTIFICATE
========================================================= */
function generateCert(){
  const name = document.getElementById('cert-name').value.trim() || '____________________';
  const date = document.getElementById('cert-date').value.trim() || new Date().toLocaleDateString();
  document.getElementById('cert-name-out').textContent = name;
  document.getElementById('cert-date-out').textContent = date;
  confettiBurst();
}

/* =========================================================
   INIT
========================================================= */
goTo(0);
document.getElementById('cert-date').value = new Date().toLocaleDateString();
</script>
