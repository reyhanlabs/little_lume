<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LittleLume English · All About Me</title>
<style>
/* ============================================================
   LITTLELUME ENGLISH — "ALL ABOUT ME"  (Grade 4 · Speaking focus)
   Single-file offline lesson. No external assets.
   ------------------------------------------------------------
   DESIGN TOKENS
   Colour  : sky #BFE3F2 · mint #BCEFDA · lavender #E4DAF7
             orange #FFD1A3 · yellow #FFF3AE · white #FFFFFF
             ink (text) #3B3358 · ink-soft #786F99 · coral (cta) #FF8B6B
   Type    : system rounded stack only (no webfonts) — personality
             carried by shape/colour/motion instead of a custom font.
   Signature: "Lumi" the firefly guide + a stepping-stone island map
             as the home screen, tying the brand name (Lume=light)
             to a character who narrates and celebrates progress.
   ============================================================ */
:root{
  --sky:#BFE3F2; --mint:#BCEFDA; --lav:#E4DAF7; --orange:#FFD1A3; --yellow:#FFF3AE;
  --white:#FFFFFF; --ink:#3B3358; --ink-soft:#786F99; --coral:#FF8B6B; --coral-deep:#F16B4D;
  --green-ok:#3FBF83; --red-no:#FF6B6B;
  --shadow: 0 10px 24px rgba(59,51,88,.12);
  --shadow-sm: 0 4px 10px rgba(59,51,88,.10);
  --radius-lg: 28px; --radius-md: 18px; --radius-sm: 12px;
  --font: -apple-system, "SF Pro Rounded", "Segoe UI Rounded", "Segoe UI", "Nunito", Verdana, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%, var(--sky) 0%, transparent 45%),
    radial-gradient(circle at 90% 10%, var(--lav) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, var(--mint) 0%, transparent 45%),
    linear-gradient(180deg,#F7FBFE 0%, #FBF9FF 100%);
  min-height:100vh;
  overflow-x:hidden;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
button{font-family:inherit; cursor:pointer;}
button:focus-visible, [tabindex]:focus-visible, a:focus-visible{
  outline:3px solid var(--coral-deep); outline-offset:2px; border-radius:8px;
}
h1,h2,h3,h4{margin:0; line-height:1.15;}
p{margin:0;}
img,svg{display:block;}
.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- App shell ---------- */
#app{max-width:1180px;margin:0 auto;padding:14px 16px 60px;}

.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; margin:0 0 16px;
  background:rgba(255,255,255,.82); backdrop-filter:blur(6px);
  border-radius:var(--radius-md); box-shadow:var(--shadow-sm);
}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.05rem;}
.brand small{display:block; font-weight:600; color:var(--ink-soft); font-size:.68rem;}
.topbar-spacer{flex:1;}
.stat-pill{
  display:flex; align-items:center; gap:6px; background:var(--white);
  border-radius:999px; padding:6px 12px; box-shadow:var(--shadow-sm); font-weight:800; font-size:.85rem;
}
.progress-wrap{flex-basis:100%; order:5; margin-top:8px;}
.progress-track{height:12px; border-radius:999px; background:#EDEAFB; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.06);}
.progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--mint),var(--sky)); width:0%; transition:width .6s cubic-bezier(.34,1.4,.64,1);}
.home-btn{
  border:none; background:var(--white); border-radius:999px; padding:8px 14px; font-weight:800;
  box-shadow:var(--shadow-sm); display:flex; gap:6px; align-items:center;
}

/* ---------- Lumi mascot ---------- */
.lumi-float{position:fixed; right:18px; bottom:18px; width:74px; height:74px; z-index:60; filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));}
.lumi-float svg{animation:lumiBob 2.6s ease-in-out infinite;}
@keyframes lumiBob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.lumi-bubble{
  position:fixed; right:96px; bottom:24px; max-width:260px; background:var(--white); border-radius:16px 16px 4px 16px;
  padding:10px 14px; font-size:.85rem; font-weight:700; box-shadow:var(--shadow); z-index:60; display:none;
}
.lumi-bubble.show{display:block; animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.7); opacity:0;}to{transform:scale(1); opacity:1;}}

/* ---------- Section headers ---------- */
.section-head{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.section-head h2{font-size:1.5rem;}
.eyebrow{
  font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
  background:var(--white); padding:4px 10px; border-radius:999px; box-shadow:var(--shadow-sm);
}
.section-sub{color:var(--ink-soft); font-weight:600; font-size:.92rem; flex-basis:100%;}

/* ---------- Cards / grid ---------- */
.card{background:var(--white); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:20px;}
.grid{display:grid; gap:16px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.btn{
  border:none; border-radius:999px; padding:11px 20px; font-weight:800; font-size:.92rem;
  background:var(--coral); color:var(--white); box-shadow:var(--shadow-sm); transition:transform .15s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(0) scale(.97);}
.btn.ghost{background:var(--white); color:var(--ink);}
.btn.mint{background:var(--mint); color:var(--ink);}
.btn.sky{background:var(--sky); color:var(--ink);}
.btn.lav{background:var(--lav); color:var(--ink);}
.btn.sm{padding:7px 14px; font-size:.8rem;}
.btn[disabled]{opacity:.45; pointer-events:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}

/* ---------- Home island map ---------- */
.island-map{position:relative; padding:30px 10px 10px;}
.path-svg{width:100%; height:auto; display:block;}
.stone-btn{
  position:absolute; transform:translate(-50%,-50%); width:130px; text-align:center;
  background:none; border:none; padding:0;
}
.stone-face{
  width:92px; height:92px; margin:0 auto 6px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:2.1rem; box-shadow:var(--shadow); border:5px solid var(--white); transition:transform .2s ease;
}
.stone-btn:hover .stone-face{transform:scale(1.08) rotate(-4deg);}
.stone-label{font-weight:800; font-size:.82rem; background:var(--white); border-radius:10px; padding:4px 8px; box-shadow:var(--shadow-sm); display:inline-block;}
.stone-lock{position:absolute; top:-4px; right:6px; font-size:1.1rem;}
.stone-done{position:absolute; top:-6px; left:2px; font-size:1.3rem;}

/* ---------- Vocabulary flashcards ---------- */
.flip-card{perspective:1200px; height:230px;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px;}
.flip-front{background:var(--white); align-items:center; justify-content:center; text-align:center;}
.flip-back{background:var(--lav); transform:rotateY(180deg); justify-content:center;}
.vocab-emoji{font-size:2.6rem;}
.vocab-word{font-weight:800; font-size:1.1rem; margin-top:4px;}
.vocab-pron{color:var(--ink-soft); font-size:.8rem; font-weight:700;}
.mini-icon-btn{border:none; background:var(--white); border-radius:999px; width:34px; height:34px; box-shadow:var(--shadow-sm); font-size:1rem;}

/* ---------- Speaking checkpoint ---------- */
.speak-box{background:var(--sky); border-radius:var(--radius-md); padding:16px; margin-top:14px;}
.mic-btn{
  width:60px; height:60px; border-radius:50%; border:none; background:var(--coral); color:#fff; font-size:1.5rem;
  box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
}
.mic-btn.listening{animation:pulseMic 1s infinite;}
@keyframes pulseMic{0%{box-shadow:0 0 0 0 rgba(255,139,107,.6);}70%{box-shadow:0 0 0 18px rgba(255,139,107,0);}100%{box-shadow:0 0 0 0 rgba(255,139,107,0);}}
.confidence-row{display:flex; align-items:center; gap:10px; margin-top:12px;}
.confidence-row input[type=range]{flex:1; accent-color:var(--coral);}

/* ---------- Sentence builder / chips ---------- */
.chip-bank{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.chip{background:var(--yellow); border:none; border-radius:12px; padding:8px 14px; font-weight:800; box-shadow:var(--shadow-sm); font-size:.9rem;}
.chip.used{opacity:.35; pointer-events:none;}
.sentence-slot{
  min-height:52px; border:3px dashed #D9D2F2; border-radius:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 10px; background:#FBFAFF;
}
.sentence-slot .chip{background:var(--mint);}

/* ---------- Quiz ---------- */
.quiz-option{
  display:block; width:100%; text-align:left; background:var(--white); border:2px solid #ECE7FB; border-radius:14px; padding:12px 16px;
  font-weight:700; margin-bottom:10px; box-shadow:var(--shadow-sm);
}
.quiz-option.correct{border-color:var(--green-ok); background:#EAFBF2;}
.quiz-option.wrong{border-color:var(--red-no); background:#FFEDED;}
.feedback-banner{border-radius:14px; padding:12px 16px; font-weight:800; margin-top:10px;}
.feedback-banner.ok{background:#EAFBF2; color:#1E8A57;}
.feedback-banner.no{background:#FFEDED; color:#C1493A;}

/* ---------- Badges / stars ---------- */
.badge-shelf{display:flex; gap:14px; flex-wrap:wrap;}
.badge{
  width:84px; text-align:center; font-size:.72rem; font-weight:800; color:var(--ink-soft);
}
.badge-icon{width:64px; height:64px; border-radius:50%; margin:0 auto 4px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; box-shadow:var(--shadow-sm);}
.badge.locked .badge-icon{background:#EFEDF7; filter:grayscale(1); opacity:.5;}
.badge.earned .badge-icon{background:linear-gradient(160deg,var(--yellow),var(--orange));}

/* ---------- Games hub tiles ---------- */
.game-tile{
  background:var(--white); border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-sm); text-align:left; border:none;
  display:flex; flex-direction:column; gap:8px;
}
.game-tile .g-emoji{font-size:1.8rem;}
.game-tile:hover{transform:translateY(-3px);}

/* memory game */
.memory-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.memory-card{aspect-ratio:1; border-radius:12px; background:var(--lav); display:flex; align-items:center; justify-content:center; font-size:1.6rem; box-shadow:var(--shadow-sm); border:none;}
.memory-card.open{background:var(--white);}
.memory-card.matched{background:#EAFBF2;}

/* word search */
.wordsearch-grid{display:grid; gap:2px; margin:14px 0; user-select:none;}
.ws-cell{width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-weight:800; background:var(--white); border-radius:6px; font-size:.85rem;}
.ws-cell.sel{background:var(--yellow);}
.ws-cell.found{background:var(--mint);}

/* balloon pop */
.balloon-field{position:relative; height:340px; background:linear-gradient(180deg,var(--sky),var(--mint)); border-radius:var(--radius-md); overflow:hidden;}
.balloon{
  position:absolute; bottom:-60px; width:70px; height:86px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:.78rem; border:none; text-align:center; padding:4px;
  animation:floatUp linear forwards;
}
@keyframes floatUp{from{bottom:-90px;}to{bottom:380px;}}
.balloon.pop{animation:none !important; transform:scale(0); opacity:0; transition:all .25s ease;}

/* spin wheel */
.wheel-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
.wheel{width:260px; height:260px; border-radius:50%; position:relative; transition:transform 3.2s cubic-bezier(.17,.67,.2,1); box-shadow:var(--shadow);}
.wheel-pointer{font-size:1.8rem;}

/* presentation project */
.teleprompter{background:var(--white); border-radius:var(--radius-md); padding:20px; box-shadow:var(--shadow); font-size:1.15rem; line-height:1.8;}
.tele-line{padding:6px 4px; border-radius:8px; color:#B9B3D3;}
.tele-line.active{background:var(--yellow); color:var(--ink); font-weight:800;}
.tele-line.done{color:var(--green-ok);}
.timer-display{font-size:2.2rem; font-weight:900; text-align:center;}
.checklist-item{display:flex; align-items:center; gap:8px; padding:6px 0; font-weight:700;}
.checklist-item input{width:18px; height:18px; accent-color:var(--coral);}

/* avatar creator */
.avatar-stage{background:var(--white); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:10px; display:flex; justify-content:center;}
.swatch-row{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:34px; height:34px; border-radius:50%; border:3px solid transparent; box-shadow:var(--shadow-sm);}
.swatch.active{border-color:var(--ink);}
.opt-btn{background:var(--white); border:2px solid #EEEAFA; border-radius:12px; padding:8px 12px; font-weight:700; font-size:.85rem;}
.opt-btn.active{border-color:var(--coral); background:#FFF1EC;}

/* certificate */
.certificate{
  background:var(--white); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:34px; text-align:center;
  border:6px double var(--orange); position:relative;
}
.certificate h2{font-size:1.6rem; margin-bottom:4px;}
.cert-name{font-size:1.8rem; font-weight:900; color:var(--coral-deep); margin:14px 0;}

/* confetti canvas */
#confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:200;}

/* tabs */
.tab-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.tab-btn{background:var(--white); border:none; border-radius:999px; padding:8px 16px; font-weight:800; box-shadow:var(--shadow-sm); color:var(--ink-soft);}
.tab-btn.active{background:var(--coral); color:#fff;}

/* ---------- Structured grammar module blocks ---------- */
.format-block{border-radius:var(--radius-md); padding:16px; margin-top:14px; background:#FBFAFF; border:2px solid #F0ECFB;}
.format-block h4{display:flex; align-items:center; gap:8px; font-size:1rem;}
.format-block.formula{background:var(--yellow); border-color:transparent;}
.formula-text{font-weight:900; font-size:1.15rem; margin-top:6px; letter-spacing:.01em;}
.example-line{border-radius:10px; padding:8px 12px; margin:6px 0; font-weight:700; font-size:.92rem; display:flex; gap:8px; align-items:flex-start;}
.example-line.good{background:#EAFBF2; color:#1E8A57;}
.example-line.bad{background:#FFEDED; color:#C1493A; text-decoration:line-through; text-decoration-color:#F3B3AC;}
.example-line .fix{margin-left:6px; text-decoration:none; font-style:italic; color:#1E8A57;}
.lesson-progress-dots{display:flex; gap:6px; margin:10px 0;}
.lesson-progress-dots span{width:10px; height:10px; border-radius:50%; background:#E7E2F7;}
.lesson-progress-dots span.done{background:var(--green-ok);}
.lesson-progress-dots span.active{background:var(--coral);}
.stage-tabs{display:flex; gap:8px; margin-bottom:14px;}
.stage-pill{flex:1; text-align:center; padding:10px; border-radius:14px; background:var(--white); font-weight:800; box-shadow:var(--shadow-sm); border:2px solid transparent; color:var(--ink-soft);}
.stage-pill.active{border-color:var(--coral); color:var(--ink);}
.stage-pill.done{background:#EAFBF2; color:#1E8A57;}
.objective-item{display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-weight:700;}
.objective-item .num{background:var(--lav); border-radius:50%; width:26px; height:26px; min-width:26px; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:900;}
.warmup-q-card{display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:var(--white); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); padding:14px; margin-bottom:12px;}
.challenge-timer{font-weight:900; font-size:1.6rem; text-align:center;}
.toast{
  position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 20px; border-radius:999px;
  font-weight:800; z-index:300; box-shadow:var(--shadow); opacity:0; transition:opacity .3s ease, top .3s ease;
}
.toast.show{opacity:1; top:34px;}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div id="app">

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button class="home-btn" id="btn-home" aria-label="Go to map home">🏝️ Map</button>
    <div class="brand">
      <span style="font-size:1.6rem">✨</span>
      <span>LittleLume English<br><small>All About Me · Grade 4</small></span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="stat-pill" title="Stars earned">⭐ <span id="stat-stars">0</span></div>
    <div class="stat-pill" title="Coins earned">🪙 <span id="stat-coins">0</span></div>
    <div class="stat-pill" title="Level">🎖️ Lv <span id="stat-level">1</span></div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </header>

  <!-- ============ MAIN SECTION MOUNT ============ -->
  <main id="section-mount"></main>

</div>

<!-- ============ LUMI MASCOT ============ -->
<div class="lumi-bubble" id="lumi-bubble"></div>
<button class="lumi-float" id="lumi-btn" aria-label="Talk to Lumi the guide" title="Hi, I'm Lumi!"></button>

<script>
/* ============================================================
   LITTLELUME ENGLISH — APP SCRIPT
   Architecture: a tiny state object + reusable "component"
   render functions (renderFlashcards, renderGrammarLesson,
   renderQuiz, renderGame...) so future LittleLume lessons can
   reuse the same building blocks with new data.
   ============================================================ */

/* ---------------- GLOBAL STATE (in-memory only) ---------------- */
const STATE = {
  stars:0, coins:0, level:1, badges:{}, sectionsDone:{},
  profile:{ name:"", nickname:"", age:9, city:"", school:"", hobby:"drawing", hobbyReason:"", subject:"English",
            subjectReason:"because I enjoy it", food:"fried rice", animal:"a dolphin", dream:"a doctor", dreamReason:"I want to help people",
            skin:"#F2C79E", hair:"#4A3222", hairStyle:"short", eyes:"#4A3222", outfit:"#FF8B6B", bg:"#BCEFDA" },
  currentSection:"home"
};
const SECTION_ORDER = ["home","objectives","warmup","profile","vocab","grammar","guidedpractice","speaking","conversation","project","gamesreview","finalchallenge"];
const BADGE_DEFS = [
  {id:"warmup", icon:"👋", label:"Warm-Up Star"},
  {id:"vocab", icon:"📚", label:"Word Wizard"},
  {id:"grammar", icon:"🧩", label:"Grammar Star"},
  {id:"guidedpractice", icon:"🎯", label:"Practice Pro"},
  {id:"speaking", icon:"🗣️", label:"Confident Speaker"},
  {id:"conversation", icon:"💬", label:"Chatty Champ"},
  {id:"project", icon:"🎤", label:"Star Speaker"},
  {id:"games", icon:"🎮", label:"Game Master"},
  {id:"review", icon:"📝", label:"Review Champion"},
  {id:"finalchallenge", icon:"🏆", label:"All-About-Me Hero"},
];

/* ---------------- UTILITIES ---------------- */
function $(sel,root=document){return root.querySelector(sel);}
function $all(sel,root=document){return [...root.querySelectorAll(sel)];}
function el(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}

function speak(text, rate=0.92){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate; u.pitch = 1.05; u.lang = "en-US";
    window.speechSynthesis.speak(u);
  }catch(e){ /* offline / unsupported: fail silently, text is still visible */ }
}

function toast(msg){
  let t = $("#toast"); 
  if(!t){ t = el("div","toast"); t.id="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove("show"), 2200);
}

function addStars(n){ STATE.stars += n; maybeLevelUp(); updateTopbar(); }
function addCoins(n){ STATE.coins += n; updateTopbar(); }
function maybeLevelUp(){
  const target = STATE.level*20;
  if(STATE.stars >= target){ STATE.level++; toast("🎉 Level up! You're now Level "+STATE.level); confettiBurst(); }
}
function earnBadge(id){
  if(STATE.badges[id]) return;
  STATE.badges[id]=true; addStars(5); addCoins(10);
  const b = BADGE_DEFS.find(x=>x.id===id);
  if(b) toast("🏅 Badge earned: "+b.label);
  confettiBurst();
}
function markSectionProgress(id){
  STATE.sectionsDone[id]=true;
  updateTopbar();
}
function updateTopbar(){
  $("#stat-stars").textContent = STATE.stars;
  $("#stat-coins").textContent = STATE.coins;
  $("#stat-level").textContent = STATE.level;
  const doneCount = Object.keys(STATE.sectionsDone).length;
  const total = SECTION_ORDER.length-1; // exclude home
  const pct = Math.min(100, Math.round(doneCount/total*100));
  $("#progress-fill").style.width = pct+"%";
}

/* ---------------- CONFETTI ---------------- */
const confettiCanvas = document.getElementById("confetti-canvas");
const ctx = confettiCanvas.getContext("2d");
function resizeCanvas(){ confettiCanvas.width=innerWidth; confettiCanvas.height=innerHeight; }
resizeCanvas(); window.addEventListener("resize", resizeCanvas);
let confettiParticles = [];
function confettiBurst(count=90){
  const colors = ["#FF8B6B","#BCEFDA","#E4DAF7","#FFD1A3","#FFF3AE","#BFE3F2"];
  for(let i=0;i<count;i++){
    confettiParticles.push({
      x: innerWidth/2 + (Math.random()-0.5)*innerWidth*0.6,
      y: -20 - Math.random()*100,
      vx: (Math.random()-0.5)*4,
      vy: 2+Math.random()*4,
      size: 5+Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360, vr:(Math.random()-0.5)*10,
      life: 0
    });
  }
  requestAnimationFrame(animateConfetti);
}
function animateConfetti(){
  ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiParticles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.rot+=p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
  confettiParticles = confettiParticles.filter(p=>p.y < innerHeight+40 && p.life<400);
  if(confettiParticles.length>0) requestAnimationFrame(animateConfetti);
  else ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
}

/* small expressive kid-character SVG generator, used across the app
   (flashcards / conversation / games) so every character has a face. */
function kidSVG({skin="#F2C79E",hair="#4A3222",hairStyle="short",outfit="#FF8B6B",mood="happy",size=72}){
  const mouth = mood==="happy" ? "M25,46 Q34,55 43,46" : mood==="wow" ? "M28,46 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0" : "M26,47 Q34,50 42,47";
  const hairPath = hairStyle==="short"
    ? `<path d="M10,30 Q10,6 34,6 Q58,6 58,30 L52,30 Q52,14 34,14 Q16,14 16,30 Z" fill="${hair}"/>`
    : `<path d="M8,34 Q6,4 34,4 Q62,4 60,34 L54,44 Q56,18 34,16 Q12,18 14,44 Z" fill="${hair}"/>`;
  return `<svg viewBox="0 0 68 68" width="${size}" height="${size}">
    <circle cx="34" cy="36" r="26" fill="${skin}"/>
    ${hairPath}
    <circle cx="24" cy="36" r="3.4" fill="#3B3358"/><circle cx="44" cy="36" r="3.4" fill="#3B3358"/>
    <circle cx="16" cy="42" r="4" fill="${outfit}" opacity=".45"/><circle cx="52" cy="42" r="4" fill="${outfit}" opacity=".45"/>
    <path d="${mouth}" stroke="#3B3358" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M4,66 Q34,50 64,66 L64,68 L4,68 Z" fill="${outfit}"/>
  </svg>`;
}

  const wrap = el("div");
  wrap.innerHTML = `
    <div class="section-head">
      <span class="eyebrow">Creative Activity</span>
      <h2>Create My Digital Profile 🧑‍🎨</h2>
      <p class="section-sub">Design your avatar and fill in your details — you'll use these later in your presentation!</p>

    <div class="grid cols-2">
      <div class="card">
        <div class="avatar-stage" id="avatar-stage"></div>
        <h4 style="margin-top:16px;">Skin tone</h4>
        <div class="swatch-row" data-field="skin">
          ${["#F2C79E","#D9A066","#8D5A3B","#FFE0BD","#4B3621"].map(c=>`<button class="swatch" style="background:${c}" data-value="${c}" aria-label="skin tone"></button>`).join("")}
        </div>
        <h4 style="margin-top:14px;">Hair colour</h4>
        <div class="swatch-row" data-field="hair">
          ${["#2B1B12","#4A3222","#8A5A2E","#D6B370","#B33A3A"].map(c=>`<button class="swatch" style="background:${c}" data-value="${c}" aria-label="hair colour"></button>`).join("")}
        </div>
        <h4 style="margin-top:14px;">Hair style</h4>
        <div class="chip-bank">
          <button class="opt-btn" data-field="hairStyle" data-value="short">Short</button>
          <button class="opt-btn" data-field="hairStyle" data-value="long">Long</button>
        </div>
        <h4 style="margin-top:14px;">Outfit colour</h4>
        <div class="swatch-row" data-field="outfit">
          ${["#FF8B6B","#BCEFDA","#E4DAF7","#BFE3F2","#FFF3AE"].map(c=>`<button class="swatch" style="background:${c}" data-value="${c}" aria-label="outfit colour"></button>`).join("")}
        </div>
        <h4 style="margin-top:14px;">Background</h4>
        <div class="swatch-row" data-field="bg">
          ${["#BCEFDA","#BFE3F2","#E4DAF7","#FFD1A3","#FFF3AE"].map(c=>`<button class="swatch" style="background:${c}" data-value="${c}" aria-label="background colour"></button>`).join("")}

      </div>
      <div class="card">
        <h3>My Details</h3>
        <div class="grid" style="grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
          <label>Name<input type="text" id="f-name" value="${p.name}" placeholder="Kevin" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
          <label>Nickname<input type="text" id="f-nickname" value="${p.nickname}" placeholder="Kiki" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
          <label>Age
            <select id="f-age" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;">
              ${[8,9,10,11].map(a=>`<option value="${a}" ${p.age==a?"selected":""}>${a}</option>`).join("")}
            </select>
          </label>
          <label>City<input type="text" id="f-city" value="${p.city}" placeholder="Bandung" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
          <label>School<input type="text" id="f-school" value="${p.school}" placeholder="Bright Elementary" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
          <label>Dream job<input type="text" id="f-dream" value="${p.dream}" placeholder="a doctor" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
          <label>Hobby
            <select id="f-hobby" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;">
              ${VOCAB.Hobbies.map(h=>`<option value="${h[0]}" ${p.hobby===h[0]?"selected":""}>${h[0]}</option>`).join("")}
            </select>
          </label>
          <label>Favorite subject<input type="text" id="f-subject" value="${p.subject}" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
          <label>Favorite food<input type="text" id="f-food" value="${p.food}" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
          <label>Favorite animal<input type="text" id="f-animal" value="${p.animal}" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;"></label>
        </div>
        <div class="btn-row">
          <button class="btn" id="save-profile">Save my profile ✅</button>
        </div>
      </div>
    </div>
  `;
  function paintAvatar(){
    $("#avatar-stage", wrap).style.background = p.bg;
    $("#avatar-stage", wrap).innerHTML = kidSVG({skin:p.skin,hair:p.hair,hairStyle:p.hairStyle,outfit:p.outfit,mood:"happy",size:180});
    $all(".swatch-row", wrap).forEach(row=>{
      const field = row.dataset.field;
      $all(".swatch", row).forEach(sw=> sw.classList.toggle("active", sw.dataset.value===p[field]));
    });
    $all(".opt-btn", wrap).forEach(b=> b.classList.toggle("active", b.dataset.value===p[b.dataset.field]));
  }
  $all(".swatch, .opt-btn", wrap).forEach(btn=>{
    btn.addEventListener("click", ()=>{
      p[btn.dataset.field] = btn.dataset.value;
      paintAvatar();
    });
  });
  paintAvatar();
  $("#save-profile", wrap).addEventListener("click", ()=>{
    p.name = $("#f-name",wrap).value.trim() || "Kevin";
    p.nickname = $("#f-nickname",wrap).value.trim();
    p.age = $("#f-age",wrap).value;
    p.city = $("#f-city",wrap).value.trim() || "my city";
    p.school = $("#f-school",wrap).value.trim() || "my school";
    p.dream = $("#f-dream",wrap).value.trim() || "a doctor";
    p.hobby = $("#f-hobby",wrap).value;
    p.subject = $("#f-subject",wrap).value.trim() || "English";
    p.food = $("#f-food",wrap).value.trim() || "fried rice";
    p.animal = $("#f-animal",wrap).value.trim() || "a dolphin";
    addStars(5); toast("Profile saved! ⭐ +5"); markSectionProgress("profile");
    lumiSay("Nice avatar, "+p.name+"! Let's learn some words next!");
  });
  return wrap;
};

/* ============================================================
   SECTION: VOCABULARY FLASHCARDS
   ============================================================ */
RENDERERS.vocab = function(){
  const wrap = el("div");
  wrap.innerHTML = `
    <div class="section-head">
      <span class="eyebrow">Vocabulary</span>
      <h2>Flashcard Deck 📚</h2>
      <p class="section-sub">Tap a card to flip it, listen to the word, then practice saying it aloud.</p>
    </div>
    <div class="tab-row" id="vocab-tabs"></div>
    <div class="grid cols-4" id="vocab-grid"></div>
    <div class="card" style="margin-top:20px;" id="vocab-quiz-mount"></div>
  `;
  const tabRow = $("#vocab-tabs", wrap);
  const grid = $("#vocab-grid", wrap);
  const categories = Object.keys(VOCAB);
  let activeCat = categories[0];

  function renderCards(){
    grid.innerHTML = "";
    VOCAB[activeCat].forEach(([word,emoji,pron,def,ex])=>{
      const card = el("div","flip-card");
      card.innerHTML = `
        <div class="flip-inner">
          <div class="flip-face flip-front">
            <div class="vocab-emoji">${emoji}</div>
            <div class="vocab-word">${word}</div>
            <div class="vocab-pron">tap to flip</div>
          </div>
          <div class="flip-face flip-back">
            <div class="vocab-word">${word}</div>
            <div class="vocab-pron">${pron}</div>
            <p style="font-size:.82rem;">${def}</p>
            <p style="font-size:.82rem;font-style:italic;">“${ex}”</p>
            <div style="display:flex; gap:6px; margin-top:6px;">
              <button class="mini-icon-btn" title="Listen" aria-label="Listen">🔊</button>
              <button class="mini-icon-btn" title="Practice speaking" aria-label="Practice">🎙️</button>
            </div>
          </div>
        </div>`;
      card.addEventListener("click", (e)=>{
        if(e.target.closest(".mini-icon-btn")) return;
        card.classList.toggle("flipped");
      });
      $all(".mini-icon-btn",card)[0].addEventListener("click",(e)=>{e.stopPropagation(); speak(ex);});
      $all(".mini-icon-btn",card)[1].addEventListener("click",(e)=>{
        e.stopPropagation();
        toast("🎙️ Say it out loud: \""+ex+"\"");
        addStars(1);
      });
      grid.appendChild(card);
    });
  }
  categories.forEach(cat=>{
    const b = el("button","tab-btn"+(cat===activeCat?" active":""), cat);
    b.addEventListener("click", ()=>{
      activeCat = cat;
      $all(".tab-btn", tabRow).forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      renderCards();
    });
    tabRow.appendChild(b);
  });
  renderCards();

  // mini quiz mixing a few words across categories
  const allWords = Object.values(VOCAB).flat();
  function pickQuizItem(){
    const item = allWords[Math.floor(Math.random()*allWords.length)];
    const distractors = allWords.filter(w=>w!==item).sort(()=>0.5-Math.random()).slice(0,2);
    const options = [item, ...distractors].sort(()=>0.5-Math.random());
    return {item, options};
  }
  let quizScore = 0, quizRound = 0;
  function renderQuizRound(){
    const mount = $("#vocab-quiz-mount", wrap);
    if(quizRound>=5){
      mount.innerHTML = `<h3>Mini Quiz complete! 🎉</h3><p>Score: ${quizScore}/5</p>`;
      addStars(quizScore); markSectionProgress("vocab"); earnBadge("vocab");
      lumiSay("Great vocabulary practice!");
      return;
    }
    const {item, options} = pickQuizItem();
    mount.innerHTML = `<h3>Mini Quiz (${quizRound+1}/5)</h3><p class="section-sub">Which word matches: “${item[3]}”?</p>`;
    options.forEach(opt=>{
      const b = el("button","quiz-option", opt[0]);
      b.addEventListener("click", ()=>{
        $all(".quiz-option", mount).forEach(x=>x.disabled=true);
        if(opt[0]===item[0]){ b.classList.add("correct"); quizScore++; addCoins(2);}
        else { b.classList.add("wrong"); }
        setTimeout(()=>{ quizRound++; renderQuizRound(); }, 900);
      });
      mount.appendChild(b);
    });
  }
  renderQuizRound();
  return wrap;
};

/* ============================================================
   SECTION: GRAMMAR LESSONS (reusable per-lesson component)
   ============================================================ */
RENDERERS.grammar = function(){
  const wrap = el("div");
  wrap.innerHTML = `
    <div class="section-head">
      <span class="eyebrow">Grammar Lesson</span>
      <h2>Grammar Modules 🧩</h2>
      <p class="section-sub">Every module follows the same steps: Explanation → Formula → Examples → Common Mistakes → Guided Practice → Speaking → Game → Mini Quiz.</p>
    </div>
    <div class="tab-row" id="grammar-tabs"></div>
    <div class="lesson-progress-dots" id="grammar-dots"></div>
    <div id="grammar-mount"></div>
  `;
  const tabRow = $("#grammar-tabs", wrap);
  const dots = $("#grammar-dots", wrap);
  const mount = $("#grammar-mount", wrap);
  let idx = 0;
  const completed = new Set();

  GRAMMAR_LESSONS.forEach((g,i)=>{
    const b = el("button","tab-btn"+(i===0?" active":""), "G"+(i+1));
    b.addEventListener("click", ()=>{ idx=i; refreshTabs(); renderLesson(); });
    tabRow.appendChild(b);
    const d = el("span"); dots.appendChild(d);
  });
  function refreshTabs(){
    $all(".tab-btn", tabRow).forEach((b,i)=>b.classList.toggle("active", i===idx));
    $all("span", dots).forEach((d,i)=>{
      d.classList.toggle("active", i===idx);
      d.classList.toggle("done", completed.has(GRAMMAR_LESSONS[i].id));
    });
  }

  function renderLesson(){
    const g = GRAMMAR_LESSONS[idx];
    mount.innerHTML = `
      <div class="card">
        <h3>${g.title}</h3>

        <div class="format-block">
          <h4>📖 Explanation</h4>
          <p style="margin-top:6px;">${g.explain}</p>
        </div>

        <div class="format-block formula">
          <h4>💡 Formula</h4>
          <p class="formula-text">${g.formula}</p>
        </div>

        <div class="format-block">
          <h4>📝 Examples</h4>
          ${g.examples.map(e=>`<div class="example-line good">✅ ${e}</div>`).join("")}
        </div>

        <div class="format-block">
          <h4>⚠️ Common Mistakes</h4>
          ${g.mistakes.map(m=>`<div class="example-line bad">❌ ${m.wrong} <span class="fix">→ ${m.fix}</span></div>`).join("")}
        </div>

        ${g.ageSelector ? `
        <div class="format-block" style="background:var(--yellow); border-color:transparent;">
          <h4>🔢 Interactive age selector</h4>
          <div style="display:flex; gap:10px; align-items:center; margin-top:8px;">
            <input type="range" min="8" max="11" value="9" id="age-slider" style="flex:1; accent-color:var(--coral);">
            <span id="age-value" style="font-weight:900; font-size:1.3rem;">9</span>
          </div>
          <p id="age-sentence" style="margin-top:8px; font-weight:700;">I am nine years old.</p>
        </div>` : ""}

        <div class="format-block">
          <h4>🎯 Guided Practice — fill in the blank</h4>
          <p style="margin-top:6px; font-size:1.05rem;">${g.fillBlank.s}</p>
          <div style="display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap;">
            <input type="text" id="fb-input" placeholder="type the missing word" style="padding:9px 12px;border-radius:10px;border:2px solid #ECE7FB;">
            <button class="btn mint sm" id="fb-check">Check</button>
          </div>
          <div id="fb-feedback" style="margin-top:8px;"></div>
        </div>

        ${g.matching ? renderMatchingHTML(g.matching) : ""}

        <div class="format-block">
          <h4>🎤 Speaking Practice</h4>
          <p style="margin-top:6px;">Say this sentence aloud: <strong>"${g.examples[0]}"</strong></p>
          <div style="display:flex; align-items:center; gap:14px; margin-top:10px;">
            <button class="mic-btn" id="mic-btn" aria-label="Listen and speak">🎤</button>
            <button class="btn sky sm" id="play-example">🔊 Hear it</button>
          </div>
          <div class="confidence-row">
            <span>😟</span><input type="range" min="1" max="5" value="3" id="confidence-slider"><span>😄</span>
          </div>
        </div>

        <div class="format-block">
          <h4>🎮 Interactive Game — Sentence Builder</h4>
          <p class="section-sub">Tap the word chips in order to build a correct sentence.</p>
          <div class="sentence-slot" id="sentence-slot"></div>
          <div class="chip-bank" id="chip-bank"></div>
          <div class="btn-row">
            <button class="btn ghost sm" id="clear-sentence">Clear</button>
            <button class="btn mint sm" id="check-sentence">Check sentence</button>
          </div>
          <div id="sentence-feedback"></div>
        </div>

        <div class="format-block">
          <h4>✅ Mini Quiz</h4>
          <p>${g.quiz.q}</p>
          <div id="grammar-quiz-mount" style="margin-top:8px;"></div>
        </div>

        <div class="btn-row">
          <button class="btn" id="lesson-done">Mark module complete ✅</button>
          ${idx<GRAMMAR_LESSONS.length-1 ? `<button class="btn ghost" id="next-lesson">Next module →</button>` : `<button class="btn ghost" id="to-guided">Continue to Guided Practice →</button>`}
        </div>
      </div>
    `;

    // age selector
    if(g.ageSelector){
      const slider = $("#age-slider", mount);
      const words = ["eight","nine","ten","eleven"];
      const update = ()=>{
        const v = +slider.value;
        $("#age-value", mount).textContent = v;
        $("#age-sentence", mount).textContent = "I am "+words[v-8]+" years old.";
      };
      slider.addEventListener("input", update); update();
    }

    // guided practice: fill in the blank
    $("#fb-check", mount).addEventListener("click", ()=>{
      const val = $("#fb-input", mount).value.trim().toLowerCase();
      const fb = $("#fb-feedback", mount);
      if(val === g.fillBlank.a.toLowerCase()){
        fb.innerHTML = `<div class="feedback-banner ok">Correct! ✅ +2 stars</div>`; addStars(2);
      } else {
        fb.innerHTML = `<div class="feedback-banner no">Not quite — the answer is “${g.fillBlank.a}”.</div>`;
      }
    });

    // sentence builder (interactive game)
    const slot = $("#sentence-slot", mount);
    const bank = $("#chip-bank", mount);
    let built = [];
    function renderBank(){
      bank.innerHTML = "";
      g.bank.forEach(word=>{
        const chip = el("button","chip", word);
        chip.addEventListener("click", ()=>{
          built.push(word); chip.classList.add("used"); renderSlot();
        });
        bank.appendChild(chip);
      });
    }
    function renderSlot(){
      slot.innerHTML = built.map(w=>`<span class="chip">${w}</span>`).join("") || `<span class="section-sub">Your sentence appears here…</span>`;
    }
    renderBank(); renderSlot();
    $("#clear-sentence", mount).addEventListener("click", ()=>{ built=[]; renderBank(); renderSlot(); $("#sentence-feedback",mount).innerHTML=""; });
    $("#check-sentence", mount).addEventListener("click", ()=>{
      const fb = $("#sentence-feedback", mount);
      const ok = built.length>0 && built.join(" ").toLowerCase() === g.answer.join(" ").toLowerCase();
      if(ok){ fb.innerHTML = `<div class="feedback-banner ok">🎉 Perfect sentence! +2 stars</div>`; addStars(2); speak(built.join(" ")); }
      else { fb.innerHTML = `<div class="feedback-banner no">Try again — remember the word order!</div>`; }
    });

    // matching (grammar 6 only)
    if(g.matching) setupMatching(mount, g.matching);

    // speaking checkpoint
    $("#play-example", mount).addEventListener("click", ()=> speak(g.examples[0]));
    const micBtn = $("#mic-btn", mount);
    micBtn.addEventListener("click", ()=>{
      micBtn.classList.add("listening");
      toast("🎙️ Listening... now say it with confidence!");
      setTimeout(()=>{ micBtn.classList.remove("listening"); toast("Nice speaking! ⭐ +1"); addStars(1); }, 1600);
    });

    // mini quiz
    const qm = $("#grammar-quiz-mount", mount);
    g.quiz.options.forEach((opt,i)=>{
      const b = el("button","quiz-option", opt);
      b.addEventListener("click", ()=>{
        $all(".quiz-option", qm).forEach(x=>x.disabled=true);
        if(i===g.quiz.correct){ b.classList.add("correct"); addStars(2); toast("Correct! ⭐+2"); }
        else { b.classList.add("wrong"); $all(".quiz-option",qm)[g.quiz.correct].classList.add("correct"); toast("Not quite — the highlighted one is correct."); }
      });
      qm.appendChild(b);
    });

    $("#lesson-done", mount).addEventListener("click", ()=>{
      if(!completed.has(g.id)){ completed.add(g.id); addStars(3); addCoins(5); refreshTabs(); }
      if(completed.size>=GRAMMAR_LESSONS.length){ markSectionProgress("grammar"); earnBadge("grammar"); toast("🏆 All grammar modules complete!"); }
      else toast("Module saved! ✅");
    });
    const nextBtn = $("#next-lesson", mount);
    if(nextBtn) nextBtn.addEventListener("click", ()=>{ idx++; refreshTabs(); renderLesson(); });
    const toGuided = $("#to-guided", mount);
    if(toGuided) toGuided.addEventListener("click", ()=> navigate("guidedpractice"));
  }

  function renderMatchingHTML(m){
    return `<div class="format-block">
      <h4>🧩 Bonus: Match hobby + reason</h4>
      <div class="grid cols-2" id="match-area">
        <div id="match-left"></div>
        <div id="match-right"></div>
      </div>
      <div id="match-feedback"></div>
    </div>`;
  }
  function setupMatching(mount, m){
    const left = $("#match-left", mount), right = $("#match-right", mount);
    let selectedLeft = null;
    const rightShuffled = [...m.right].sort(()=>0.5-Math.random());
    const matched = new Set();
    m.left.forEach((txt,i)=>{
      const b = el("button","quiz-option", txt);
      b.addEventListener("click", ()=>{
        if(matched.has(i)) return;
        $all(".quiz-option", left).forEach(x=>x.style.outline="");
        selectedLeft = i; b.style.outline="3px solid var(--coral)";
      });
      left.appendChild(b);
    });
    rightShuffled.forEach(txt=>{
      const b = el("button","quiz-option", txt);
      b.addEventListener("click", ()=>{
        if(selectedLeft===null) return;
        const correctTxt = m.right[selectedLeft];
        if(txt===correctTxt){
          b.classList.add("correct"); b.disabled=true; matched.add(selectedLeft);
          addStars(1);
          if(matched.size===m.left.length){ $("#match-feedback",mount).innerHTML = `<div class="feedback-banner ok">All matched! Great reasoning with "because"! 🎉</div>`; }
        } else {
          b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"),600);
        }
        selectedLeft=null;
      });
      right.appendChild(b);
    });
  }

  renderLesson();
  return wrap;
};

/* ============================================================
   SECTION: GUIDED PRACTICE (consolidated review: fill-blank,
   drag & drop, matching, multiple choice, + listening check)
   ============================================================ */
RENDERERS.guidedpractice = function(){
  const wrap = el("div");
  wrap.innerHTML = `
    <div class="section-head">
      <span class="eyebrow">Guided Practice</span>
      <h2>Practice It All 🖊️</h2>
      <p class="section-sub">Mixed exercises pulling together everything from the grammar modules.</p>
    </div>
    <div class="tab-row" id="gp-tabs"></div>
    <div id="gp-mount"></div>
  `;
  const tabs = [
    {id:"fill", label:"✍️ Fill the Blank"},
    {id:"drag", label:"🧲 Drag &amp; Drop"},
    {id:"match", label:"🔗 Matching"},
    {id:"mc", label:"🔘 Multiple Choice"},
    {id:"listen", label:"👂 Listening Check"},
  ];
  const tabRow = $("#gp-tabs", wrap);
  const mount = $("#gp-mount", wrap);
  const done = new Set();
  function checkAllDone(){
    if(done.size>=tabs.length){ markSectionProgress("guidedpractice"); earnBadge("guidedpractice"); }
  }
  function showTab(id){
    $all(".tab-btn", tabRow).forEach(b=>b.classList.toggle("active", b.dataset.id===id));
    mount.innerHTML = "";
    if(id==="fill") mount.appendChild(GAME_RENDERERS.missing(()=>{done.add("fill"); checkAllDone();}));
    if(id==="drag") mount.appendChild(GAME_RENDERERS.dragdrop(()=>{done.add("drag"); checkAllDone();}));
    if(id==="match") mount.appendChild(GAME_RENDERERS.matching(()=>{done.add("match"); checkAllDone();}));
    if(id==="mc") mount.appendChild(GAME_RENDERERS.quizchallenge(()=>{done.add("mc"); checkAllDone();}));
    if(id==="listen") mount.appendChild(renderListeningCheck(()=>{done.add("listen"); checkAllDone();}));
  }
  tabs.forEach((t,i)=>{
    const b = el("button","tab-btn"+(i===0?" active":""));
    b.innerHTML = t.label; b.dataset.id = t.id;
    b.addEventListener("click", ()=>showTab(t.id));
    tabRow.appendChild(b);
  });
  showTab("fill");
  return wrap;
};

function renderListeningCheck(onDone){
  const box = el("div","card");
  box.innerHTML = `<h3>👂 Listening Check</h3><p class="section-sub">Listen to the introduction, then answer the questions.</p>
    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
      ${kidSVG({skin:"#F2C79E",hair:"#2B1B12",hairStyle:"short",outfit:"#BFE3F2",mood:"happy",size:80})}
      <div style="flex:1;">
        <p style="line-height:1.7;">${LISTENING_TEXT}</p>

GAME_RENDERERS.memory = function(onWin){
  const pool = Object.values(VOCAB).flat().sort(()=>0.5-Math.random()).slice(0,8);
  let deck = [...pool.map(p=>p[1]+p[0]), ...pool.map(p=>p[1]+p[0])].sort(()=>0.5-Math.random());
  const box = el("div","card");
  box.innerHTML = `<h3>🧠 Memory Game</h3><p class="section-sub">Find all 8 pairs.</p><div class="memory-grid" id="mem-grid"></div><div id="mem-fb"></div>`;
  const grid = $("#mem-grid",box);
  let first=null, lock=false, pairsFound=0;
  deck.forEach((val,i)=>{
    const c = el("button","memory-card","❓");
    c.dataset.val = val; c.dataset.idx = i;
    c.addEventListener("click", ()=>{
      if(lock || c.classList.contains("matched") || c.classList.contains("open")) return;
      c.classList.add("open"); c.textContent = val;
      if(!first){ first = c; return; }
      lock = true;
      if(first.dataset.val === c.dataset.val && first!==c){
        first.classList.add("matched"); c.classList.add("matched"); pairsFound++;
        addStars(1); first=null; lock=false;
        if(pairsFound===pool.length){ $("#mem-fb",box).innerHTML = `<div class="feedback-banner ok">All pairs found! 🎉</div>`; onWin(); }
      } else {
        setTimeout(()=>{ first.classList.remove("open"); first.textContent="❓"; c.classList.remove("open"); c.textContent="❓"; first=null; lock=false; }, 700);
      }
    });
    grid.appendChild(c);
  });
  return box;
};

// --- Word search ---
GAME_RENDERERS.wordsearch = function(onWin){
  const words = ["KIND","FUNNY","ACTIVE","BOOK"];
  const size = 8;
  let grid = Array.from({length:size},()=>Array(size).fill(""));
  // place words horizontally/vertically simply
  function placeWord(word, row, col, dir){
    for(let i=0;i<word.length;i++){
      const r = dir==="V"? row+i : row;
      const c = dir==="H"? col+i : col;
      if(r>=size||c>=size) return false;
      grid[r][c]=word[i];
    }
    return true;
  }
  placeWord("KIND",1,1,"H"); placeWord("FUNNY",3,0,"V"); placeWord("ACTIVE",5,2,"H"); placeWord("BOOK",0,6,"V");
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*26)];

  const box = el("div","card");
  box.innerHTML = `<h3>🔎 Word Search</h3><p class="section-sub">Find: ${words.join(", ")}. Click letters in a row to select, click the last one again to confirm.</p>
    <div class="wordsearch-grid" style="grid-template-columns:repeat(${size},34px);" id="ws-grid"></div>
    <div id="ws-fb"></div>`;
  const gridEl = $("#ws-grid",box);
  let selection=[];
  const foundWords = new Set();
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    const cell = el("button","ws-cell", grid[r][c]);
    cell.dataset.r=r; cell.dataset.c=c;
    cell.addEventListener("click", ()=>{
      cell.classList.add("sel"); selection.push({r,c,ch:grid[r][c],el:cell});
      const str = selection.map(s=>s.ch).join("");
      const rev = str.split("").reverse().join("");
      const hit = words.find(w=> (w===str||w===rev) && !foundWords.has(w));
      if(hit){
        foundWords.add(hit);
        selection.forEach(s=>{ s.el.classList.remove("sel"); s.el.classList.add("found"); });
        selection=[];
        addStars(2);
        if(foundWords.size===words.length){ $("#ws-fb",box).innerHTML=`<div class="feedback-banner ok">Found them all! 🎉</div>`; onWin(); }
      } else if(selection.length>6){
        selection.forEach(s=>s.el.classList.remove("sel")); selection=[];
      }
    });
    gridEl.appendChild(cell);
  }
  return box;
};

      });

    });
  }
  render();
  return box;
};

/* ============================================================
   SECTION: MAIN PROJECT — Self Introduction Presentation
   ============================================================ */
RENDERERS.project = function(){
  const p = STATE.profile;
  const wrap = el("div");
  const lines = [
    "Hello everyone.",
    `My name is ${p.name||"___"}.`,
    `My nickname is ${p.nickname||"___"}.`,
    `I am ${p.age||"___"} years old.`,
    `I live in ${p.city||"___"}.`,
    `I study at ${p.school||"___"} School.`,
    "I am in Grade 4.",
    "I am friendly and hardworking.",
    `My hobby is ${p.hobby||"___"}.`,
    `I like ${p.hobby||"this"} because ${p.hobbyReason||"it makes me happy"}.`,
    `My favorite subject is ${p.subject||"___"} because ${p.subjectReason||"I enjoy it"}.`,
    `My favorite food is ${p.food||"___"}.`,
    `My favorite animal is ${p.animal||"___"}.`,
    `In the future, I want to be ${p.dream||"___"} because ${p.dreamReason||"I want to help people"}.`,
    "Thank you for listening.",
  ];
  wrap.innerHTML = `
    <div class="section-head">
      <span class="eyebrow">Main Project</span>
      <h2>My Self-Introduction Presentation 🎤</h2>
      <p class="section-sub">Practice sentence-by-sentence, then perform your full presentation!</p>
    </div>
    ${(!p.name) ? `<div class="feedback-banner no">Visit "My Profile" first to fill in your details for a personalised script!</div>` : ""}
    <div class="grid cols-2">
      <div class="card">
        <h3>Customize your reasons</h3>
        <label>Why do you like your hobby?<input type="text" id="proj-hobby-reason" value="${p.hobbyReason}" placeholder="it makes me happy" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;margin-top:4px;"></label>
        <label style="display:block;margin-top:10px;">Why is it your favourite subject?<input type="text" id="proj-subject-reason" value="${p.subjectReason}" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;margin-top:4px;"></label>
        <label style="display:block;margin-top:10px;">Why that dream job?<input type="text" id="proj-dream-reason" value="${p.dreamReason}" style="width:100%;padding:8px;border-radius:10px;border:2px solid #ECE7FB;margin-top:4px;"></label>
        <div class="btn-row"><button class="btn sm" id="proj-save">Update script ✅</button></div>

        <h4 style="margin-top:18px;">Speaking checklist</h4>
        <div id="proj-checklist"></div>
      </div>
      <div class="card">
        <h3>Teleprompter</h3>
        <div class="teleprompter" id="teleprompter"></div>
        <div class="btn-row">
          <button class="btn sky sm" id="proj-prev">◀ Prev line</button>
          <button class="btn sky sm" id="proj-hear-line">🔊 Hear line</button>
          <button class="btn sky sm" id="proj-next">Next line ▶</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h3>Perform your presentation</h3>
      <div class="timer-display" id="proj-timer">01:15</div>
      <div class="confidence-row"><span>😟</span><input type="range" min="1" max="5" value="3" id="proj-confidence"><span>😄</span></div>
      <div class="btn-row">
        <button class="btn" id="proj-start">Start timer &amp; perform 🎬</button>
        <button class="btn ghost" id="proj-replay">🔁 Replay whole script</button>
        <button class="btn ghost" id="proj-tryagain">Try again</button>
      </div>
      <div id="proj-result"></div>
    </div>
  `;
  $("#proj-save", wrap)?.addEventListener("click", ()=>{
    p.hobbyReason = $("#proj-hobby-reason",wrap).value.trim();
    p.subjectReason = $("#proj-subject-reason",wrap).value.trim();
    p.dreamReason = $("#proj-dream-reason",wrap).value.trim();
    navigate("project");
  });

  const checklist = ["I said my name clearly","I told my age","I told where I live","I explained my hobby with 'because'","I said thank you at the end"];
  const cl = $("#proj-checklist", wrap);
  checklist.forEach((c,i)=>{
    const row = el("label","checklist-item", `<input type="checkbox" id="cl-${i}"> ${c}`);
    cl.appendChild(row);
  });

  let lineIdx = 0;
  const tele = $("#teleprompter", wrap);
  function renderTele(){
    tele.innerHTML = lines.map((l,i)=>`<div class="tele-line ${i===lineIdx?'active':i<lineIdx?'done':''}">${l}</div>`).join("");
  }
  renderTele();
  $("#proj-prev",wrap).addEventListener("click", ()=>{ lineIdx=Math.max(0,lineIdx-1); renderTele(); });
  $("#proj-next",wrap).addEventListener("click", ()=>{ lineIdx=Math.min(lines.length-1,lineIdx+1); renderTele(); });
  $("#proj-hear-line",wrap).addEventListener("click", ()=> speak(lines[lineIdx]));
  $("#proj-replay",wrap).addEventListener("click", ()=> speak(lines.join(" ")) );

  // timer
  let timerId=null, secondsLeft=75;
  const timerDisp = $("#proj-timer",wrap);
  function fmt(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); }
  $("#proj-start",wrap).addEventListener("click", ()=>{
    clearInterval(timerId); secondsLeft=75; timerDisp.textContent=fmt(secondsLeft);
    timerId = setInterval(()=>{
      secondsLeft--; timerDisp.textContent=fmt(Math.max(0,secondsLeft));
      if(secondsLeft<=0){
        clearInterval(timerId);
        finishPresentation();
      }
    },1000);
    lumiSay("You've got this! Speak clearly and smile!");
  });
  $("#proj-tryagain",wrap).addEventListener("click", ()=>{
    clearInterval(timerId); secondsLeft=75; timerDisp.textContent=fmt(secondsLeft);
    $("#proj-result",wrap).innerHTML="";
    $all("input[type=checkbox]",wrap).forEach(c=>c.checked=false);
  });
  function finishPresentation(){
    const checks = $all("input[type=checkbox]",wrap).filter(c=>c.checked).length;
    $("#proj-result",wrap).innerHTML = `<div class="feedback-banner ok">🎉 Wonderful presentation, ${p.name||"star"}! Checklist: ${checks}/${checklist.length}. 👏👏👏</div>`;
    addStars(10); addCoins(15); markSectionProgress("project"); earnBadge("project");
    confettiBurst(140);
  }
  return wrap;
};

/* ============================================================
   SECTION: FINAL REVIEW + CERTIFICATE
   ============================================================ */
const REVIEW_BANK = [
  {type:"vocab", q:"Which word means 'makes people laugh'?", options:["honest","funny","polite"], correct:1},
  {type:"grammar", q:"Choose the correct sentence:", options:["I am nine year old.","I am nine years old.","I nine years old."], correct:1},
  {type:"listening", q:"In the listening story, what is Kevin's hobby?", options:["Singing","Drawing","Cooking"], correct:1},
  {type:"grammar", q:"Complete: My favorite ___ is a dolphin.", options:["animal","food","subject"], correct:0},
  {type:"vocab", q:"Which word matches 🏸 ?", options:["playing badminton","playing football","cycling"], correct:0},
  {type:"speaking", q:"Practice saying: \"I want to be a pilot because I love flying.\" Ready?", options:["I said it confidently!","I need more practice."], correct:0},
  {type:"interview", q:"Answer aloud: What is your favorite subject and why?", options:["I answered in a full sentence!","I'll try next time."], correct:0},
  {type:"arrangement", q:"Put in order: 'in / I / Bandung / live'", options:["I live in Bandung.","In live I Bandung.","Bandung live I in."], correct:0},
  {type:"picture", q:"Describe this picture: 🎨✏️ — which sentence fits best?", options:["My hobby is drawing.","My hobby is cooking.","My hobby is singing."], correct:0},
  {type:"oral", q:"Mini oral test: Say your full self-introduction from memory. Did you include your name, age, city, hobby, and dream job?", options:["Yes, I included everything!","I missed a few parts."], correct:0},
];
function renderReviewQuiz(onFinish){
  const wrap = el("div","card");
  wrap.innerHTML = `<h3>Review Quiz 📝</h3><p class="section-sub">A mix of vocabulary, grammar, listening, and speaking to check your understanding.</p><div id="review-mount" style="margin-top:10px;"></div>`;
  const mount = $("#review-mount", wrap);
  let i=0, score=0;
  function render(){
    if(i>=REVIEW_BANK.length){
      const pct = Math.round(score/REVIEW_BANK.length*100);
      mount.innerHTML = `<div class="feedback-banner ok">Review complete! Score: ${score}/${REVIEW_BANK.length} (${pct}%) 🎉</div>`;
      addStars(score*2); addCoins(20);
      onFinish();
      confettiBurst(120);
      return;
    }
    const item = REVIEW_BANK[i];
    mount.innerHTML = `<p class="eyebrow">${item.type}</p><h4 style="margin:6px 0 12px;">Question ${i+1} of ${REVIEW_BANK.length}</h4><p>${item.q}</p>`;
    item.options.forEach((opt,idx)=>{
      const b = el("button","quiz-option", opt);
      b.addEventListener("click", ()=>{
        $all(".quiz-option",mount).forEach(x=>x.disabled=true);
        if(idx===item.correct){ b.classList.add("correct"); score++; }
        else { b.classList.add("wrong"); $all(".quiz-option",mount)[item.correct].classList.add("correct"); }
        setTimeout(()=>{ i++; render(); }, 800);
      });
      mount.appendChild(b);
    });
  }
  render();
  return wrap;
}

/* ============================================================
   SECTION: FINAL SPEAKING CHALLENGE
   Random questions, no hints/examples shown — a true fluency check.
   ============================================================ */
const FINAL_CHALLENGE_POOL = [
  "What is your name?",
  "How old are you?",
  "Where do you live?",
  "What school do you go to?",
  "What is your hobby, and why do you like it?",
  "What is your favorite subject?",
  "What is your favorite food?",
  "What is your favorite animal?",
  "What do you want to be in the future, and why?",
  "Tell me one word that describes your personality.",
];
RENDERERS.finalchallenge = function(){
  const wrap = el("div");
  const questions = [...FINAL_CHALLENGE_POOL].sort(()=>0.5-Math.random()).slice(0,6);
  wrap.innerHTML = `
    <div class="section-head">
      <span class="eyebrow">Final Speaking Challenge</span>
      <h2>No Notes — Just Speak! 🏆</h2>
      <p class="section-sub">Answer each random question out loud, with no examples to look at. You've got this!</p>
    </div>
    <div class="card" id="fc-mount"></div>
  `;
  const mount = $("#fc-mount", wrap);
  let qi = 0;
  function renderQ(){
    if(qi>=questions.length){
      addStars(15); addCoins(25); markSectionProgress("finalchallenge"); earnBadge("finalchallenge");
      showCertificate();
      return;
    }
    mount.innerHTML = `
      <p class="eyebrow">Question ${qi+1} of ${questions.length}</p>
      <h3 style="margin-top:8px;">${questions[qi]}</h3>
      <div class="challenge-timer" id="fc-timer">10</div>
      <div style="display:flex; justify-content:center; margin:14px 0;">
        <button class="mic-btn" id="fc-mic">🎤</button>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="fc-next">I answered! Next →</button>
      </div>
    `;
    let t = 10;
    const timerEl = $("#fc-timer", mount);
    clearInterval(window.__fcTimer);
    window.__fcTimer = setInterval(()=>{
      t--; timerEl.textContent = Math.max(0,t);
      if(t<=0) clearInterval(window.__fcTimer);
    },1000);
    $("#fc-mic", mount).addEventListener("click", (e)=>{
      e.target.classList.add("listening");
      setTimeout(()=>e.target.classList.remove("listening"), 1500);
    });
    $("#fc-next", mount).addEventListener("click", ()=>{
      clearInterval(window.__fcTimer);
      addStars(2); qi++; renderQ();
    });
  }
  function showCertificate(){
    const p = STATE.profile;
    mount.innerHTML = `
      <div class="certificate">
        <div style="font-size:2.4rem;">🏅</div>
        <h2>Certificate of Completion</h2>
        <p class="section-sub">LittleLume English · All About Me</p>
        <div class="cert-name">${p.name || "Little Star"}</div>
        <p>has successfully completed the "All About Me" speaking journey<br>and can confidently introduce themselves in English!</p>
        <div style="margin-top:16px; display:flex; justify-content:center; gap:24px; flex-wrap:wrap;">
          <span>⭐ ${STATE.stars} stars</span><span>🪙 ${STATE.coins} coins</span><span>🎖️ Level ${STATE.level}</span>
        </div>
        <div style="margin-top:14px;">${kidSVG({...avatarSkinProps(), mood:"cheer", size:100})}</div>
      </div>`;
    confettiBurst(220);
    lumiSay("You did it! I'm so proud of you! 🎉");
  }
  renderQ();
  return wrap;
};
