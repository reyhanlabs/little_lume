<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LittleLume English — Unit 1: Hello! (Part 2) — Hello Festival</title>
<style>
  :root{
    --sky:#FFF7F0;
    --pink:#FFD6E8;
    --lavender:#E3D9FF;
    --mint:#D2F5E3;
    --yellow:#FFEFB0;
    --coral:#FF9E80;
    --coral-dark:#F2765A;
    --ink:#4A4460;
    --ink-soft:#6B6480;
    --white:#FFFFFF;
    --shadow: 0 10px 28px rgba(74,68,96,0.14);
    --radius: 28px;
    --font-display: "Baloo 2","Segoe UI Rounded",ui-rounded,"Comic Sans MS",cursive,sans-serif;
    --font-body: -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:
      radial-gradient(circle at 10% 10%, var(--pink) 0%, transparent 45%),
      radial-gradient(circle at 90% 0%, var(--lavender) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, var(--mint) 0%, transparent 45%),
      var(--sky);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:var(--font-display); font-weight:800;}
  button{font-family:var(--font-body); cursor:pointer;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ===== TOP BAR / BUNTING PROGRESS ===== */
  #topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(255,247,240,0.92);
    backdrop-filter:blur(6px);
    padding:10px 14px 6px;
    border-bottom:2px dashed rgba(74,68,96,0.15);
  }
  #stats{
    display:flex; align-items:center; justify-content:space-between;
    max-width:900px; margin:0 auto 8px;
  }
  .brand{display:flex; align-items:center; gap:8px; font-size:1.05rem;}
  .brand .logo{
    font-size:1.5rem; display:inline-block; animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-4px) rotate(4deg);}}
  .pillrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .pill{
    background:var(--white); border-radius:999px; padding:6px 12px;
    font-weight:700; box-shadow:var(--shadow); font-size:0.9rem;
    display:flex; align-items:center; gap:5px;
  }
  .iconbtn{
    background:var(--white); border:none; border-radius:50%;
    width:38px; height:38px; box-shadow:var(--shadow); font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{transform:scale(0.9);}

  /* Bunting garland */
  #garland-wrap{max-width:900px; margin:0 auto; overflow-x:auto; padding-bottom:4px;}
  #garland{
    display:flex; gap:4px; min-width:max-content; padding:6px 4px;
  }
  .flag{
    width:34px; height:40px;
    background:var(--white);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    display:flex; align-items:flex-start; justify-content:center;
    font-size:0.85rem; padding-top:4px;
    box-shadow:0 2px 4px rgba(74,68,96,0.12);
    transition: all .35s ease;
    flex:0 0 auto;
    opacity:0.55;
    cursor:pointer;
    color:var(--ink);
  }
  .flag.done{background:linear-gradient(160deg,var(--coral),var(--yellow)); opacity:1; transform:translateY(-4px);}
  .flag.current{background:linear-gradient(160deg,var(--lavender),var(--pink)); opacity:1; box-shadow:0 0 0 3px rgba(255,158,128,0.5);}

  /* ===== MAIN LAYOUT ===== */
  #app{max-width:900px; margin:0 auto; padding:18px 14px 90px;}
  .screen{display:none; animation: fadeUp .45s ease;}
  .screen.active{display:block;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);}}

  .card{
    background:var(--white); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 20px; margin-bottom:16px;
    position:relative;
  }
  .story-card{
    background:linear-gradient(135deg,var(--lavender),var(--pink));
    border-radius:var(--radius); padding:24px 20px; margin-bottom:18px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .story-card::after{
    content:"🎈"; position:absolute; right:-6px; top:-10px; font-size:3.2rem; opacity:.5;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .mascot-row{display:flex; align-items:center; gap:14px;}
  .mascot{
    font-size:3rem; background:var(--white); border-radius:50%;
    width:74px; height:74px; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); flex:0 0 auto;
  }
  .speech{
    background:var(--white); border-radius:20px; padding:12px 16px;
    box-shadow:var(--shadow); font-size:1.02rem; line-height:1.4; flex:1;
  }
  .eyebrow{
    font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
    font-size:0.78rem; color:var(--coral-dark); margin-bottom:4px; display:block;
  }
  h2.title{font-size:1.5rem; margin:2px 0 10px;}
  p.lead{color:var(--ink-soft); margin:0 0 14px; line-height:1.5;}

  .btn{
    border:none; border-radius:18px; padding:14px 22px; font-weight:800;
    font-size:1.02rem; box-shadow:var(--shadow); transition:transform .15s ease;
    background:var(--coral); color:var(--white);
  }
  .btn:active{transform:scale(0.95);}
  .btn.secondary{background:var(--white); color:var(--ink); border:2px solid var(--lavender);}
  .btn.ghost{background:transparent; box-shadow:none; color:var(--ink-soft); text-decoration:underline;}
  .btn:disabled{opacity:0.4; pointer-events:none;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}

  .grid{display:grid; gap:12px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:520px){ .grid-3{grid-template-columns:repeat(2,1fr);} }

  .tile{
    background:var(--sky); border:3px solid var(--white); border-radius:20px;
    padding:16px 8px; text-align:center; box-shadow:var(--shadow);
    font-weight:700; user-select:none; transition:transform .15s ease, background .2s ease;
  }
  .tile .emoji{font-size:2.1rem; display:block; margin-bottom:6px;}
  .tile:active{transform:scale(0.94);}
  .tile.selected{border-color:var(--coral); background:var(--yellow);}
  .tile.correct{background:var(--mint); border-color:#4CAF7D;}
  .tile.wrong{background:#FFD6D6; border-color:#E88; animation:shake .35s;}
  .tile.matched{opacity:0.35; pointer-events:none;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .hearbtn{
    background:var(--lavender); border:none; border-radius:14px; padding:8px 14px;
    font-weight:700; font-size:0.95rem; margin-top:8px; box-shadow:var(--shadow);
  }

  .banner-badge{
    position:fixed; inset:0; background:rgba(74,68,96,0.55); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .banner-badge.show{display:flex;}
  .badge-pop{
    background:var(--white); border-radius:28px; padding:32px 26px; text-align:center;
    max-width:340px; box-shadow:0 20px 50px rgba(0,0,0,0.3); animation:popIn .4s ease;
  }
  @keyframes popIn{from{transform:scale(0.6); opacity:0;} to{transform:scale(1); opacity:1;}}
  .badge-pop .big-emoji{font-size:4rem; margin-bottom:6px;}

  #confetti-wrap{position:fixed; inset:0; pointer-events:none; z-index:300; overflow:hidden;}
  .confetti-piece{position:absolute; top:-20px; border-radius:2px; opacity:0.9;}

  .checklist-item{
    display:flex; align-items:center; gap:12px; padding:10px 4px;
    border-bottom:1px dashed rgba(74,68,96,0.15); cursor:pointer;
  }
  .checklist-item:last-child{border-bottom:none;}
  .checkbox{
    width:28px; height:28px; border-radius:8px; border:2px solid var(--lavender);
    background:var(--white); flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-weight:900;
  }
  .checkbox.checked{background:var(--mint); border-color:#4CAF7D; color:#2c7a51;}

  .progressbar-outer{
    background:var(--sky); border-radius:999px; height:16px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,0.08);
  }
  .progressbar-inner{
    height:100%; background:linear-gradient(90deg,var(--coral),var(--yellow)); border-radius:999px;
    transition:width .5s ease; width:0%;
  }

  canvas.traceboard{
    width:100%; max-width:340px; height:220px; background:var(--sky); border-radius:20px;
    border:3px dashed var(--lavender); touch-action:none; display:block; margin:0 auto;
  }
  .craft-board{
    background:var(--sky); border-radius:20px; border:3px dashed var(--lavender);
    height:260px; position:relative; overflow:hidden; touch-action:none;
  }
  .sticker{
    position:absolute; font-size:2rem; cursor:grab; user-select:none; touch-action:none;
  }
  .sticker-tray{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .sticker-source{
    font-size:1.8rem; background:var(--white); border-radius:14px; padding:8px 12px;
    box-shadow:var(--shadow); cursor:grab; touch-action:none;
  }

  footer.navbar{
    position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.95);
    backdrop-filter:blur(6px); box-shadow:0 -6px 18px rgba(0,0,0,0.08);
    padding:10px 16px; display:flex; justify-content:space-between; z-index:40;
  }
  footer.navbar .btn{flex:1; max-width:160px;}

  .fullscreen-target:fullscreen{background:var(--sky);}

  .certificate{
    text-align:center; background:linear-gradient(160deg,var(--yellow),var(--pink));
    border-radius:24px; padding:26px 18px; border:4px double var(--coral);
  }
  .certificate h2{font-size:1.8rem; margin:6px 0;}
  .certificate .name-line{font-size:1.2rem; font-weight:700; margin:14px 0; border-bottom:2px solid var(--ink); display:inline-block; min-width:220px;}

  ::selection{background:var(--yellow);}
  :focus-visible{outline:3px solid var(--coral-dark); outline-offset:2px;}
</style>
</head>
<body class="fullscreen-target">

<div id="topbar">
  <div id="stats">
    <div class="brand"><span class="logo">🌟</span><span class="display">LittleLume</span></div>
    <div class="pillrow">
      <span class="pill">⭐ <span id="starCount">0</span></span>
      <span class="pill">🪙 <span id="coinCount">0</span></span>
      <button class="iconbtn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <button class="iconbtn" id="fsBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
  </div>
  <div id="garland-wrap"><div id="garland"></div></div>
</div>

<div id="app"></div>

<footer class="navbar">
  <button class="btn secondary" id="prevBtn">← Back</button>
  <button class="btn" id="nextBtn">Next →</button>
</footer>

<div class="banner-badge" id="badgeModal">
  <div class="badge-pop">
    <div class="big-emoji" id="badgeEmoji">🏅</div>
    <h2 id="badgeTitle">Badge Earned!</h2>
    <p id="badgeText" style="color:var(--ink-soft)"></p>
    <button class="btn" id="badgeClose">Yay! Continue</button>
  </div>
</div>

<div id="confetti-wrap"></div>

<script>
(function(){
"use strict";

/* ============ STATE ============ */
const state = {
  stars: 0, coins: 0,
  badges: [],
  soundOn: true,
  screenIndex: 0
};

/* ============ AUDIO (Web Audio API, no external files) ============ */
let actx;
function ac(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function beep(freq=520, dur=0.12, type="sine", vol=0.18){
  if(!state.soundOn) return;
  try{
    const ctx = ac();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur+0.02);
  }catch(e){}
}
function successChime(){ beep(660,0.1); setTimeout(()=>beep(880,0.15),110); setTimeout(()=>beep(1046,0.2),230); }
function errorBuzz(){ beep(180,0.18,"sawtooth",0.15); }
function speak(text){
  if(!state.soundOn) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate=0.85; u.pitch=1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ CONFETTI ============ */
function confetti(n=40){
  const wrap = document.getElementById("confetti-wrap");
  const colors = ["#FF9E80","#FFD6E8","#E3D9FF","#D2F5E3","#FFEFB0"];
  for(let i=0;i<n;i++){
    const p = document.createElement("div");
    p.className="confetti-piece";
    const size = 6+Math.random()*8;
    p.style.width=size+"px"; p.style.height=(size*1.4)+"px";
    p.style.left=(Math.random()*100)+"vw";
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    const dur = 2+Math.random()*1.6;
    p.style.transition=`transform ${dur}s ease-in, top ${dur}s ease-in, opacity ${dur}s ease-in`;
    wrap.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.top = (100+Math.random()*10)+"vh";
      p.style.transform += ` rotate(${720+Math.random()*360}deg)`;
      p.style.opacity="0.15";
    });
    setTimeout(()=>p.remove(), dur*1000+300);
  }
}

/* ============ REWARDS ============ */
function giveReward({stars=0, coins=0, badge=null}={}){
  state.stars+=stars; state.coins+=coins;
  document.getElementById("starCount").textContent=state.stars;
  document.getElementById("coinCount").textContent=state.coins;
  if(stars||coins) successChime();
  if(badge && !state.badges.includes(badge.id)){
    state.badges.push(badge.id);
    showBadge(badge);
  }
}
function showBadge(badge){
  document.getElementById("badgeEmoji").textContent=badge.emoji;
  document.getElementById("badgeTitle").textContent=badge.title;
  document.getElementById("badgeText").textContent=badge.text;
  document.getElementById("badgeModal").classList.add("show");
  confetti(50);
}
document.getElementById("badgeClose").addEventListener("click", ()=>{
  document.getElementById("badgeModal").classList.remove("show");
});

/* ============ SOUND / FULLSCREEN TOGGLES ============ */
document.getElementById("soundBtn").addEventListener("click", (e)=>{
  state.soundOn=!state.soundOn;
  e.target.textContent = state.soundOn ? "🔊" : "🔇";
});
document.getElementById("fsBtn").addEventListener("click", ()=>{
  const el = document.body;
  if(!document.fullscreenElement){ el.requestFullscreen && el.requestFullscreen(); }
  else{ document.exitFullscreen && document.exitFullscreen(); }
});

/* ============ VOCAB DATA ============ */
const VOCAB = [
  {word:"hello", emoji:"👋"},
  {word:"hi", emoji:"🙌"},
  {word:"teacher", emoji:"🧑‍🏫"},
  {word:"friend", emoji:"🤝"},
  {word:"wave", emoji:"✋"},
  {word:"smile", emoji:"😊"},
  {word:"school", emoji:"🏫"},
  {word:"name", emoji:"📛"}
];
const GREETINGS = ["Hello!", "Hi!", "Good morning!", "My name is Lumi."];

/* ============ SCREEN DEFINITIONS ============ */
const screens = [];
function addScreen(cfg){ screens.push(cfg); }

/* ---- Screen 0: Story intro ---- */
addScreen({
  id:"story-intro", nav:"Festival",
  render(c){
    c.innerHTML = `
      <div class="story-card">
        <div class="mascot-row">
          <div class="mascot">🦊</div>
          <div class="speech">
            <span class="eyebrow">Little Lumi says</span>
            The Hello Festival is starting soon! All my friends are getting ready.
            To join the party, we need to finish a few fun missions together. Are you ready, superstar?
          </div>
        </div>
      </div>
      <div class="card">
        <span class="eyebrow">Today's Missions</span>
        <h2 class="title">Get your festival badges! 🎪</h2>
        <p class="lead">Talk with a partner, move your body, make art, use your senses, and play games. Every mission gives you stars, coins, and a shiny badge!</p>
        <div class="grid grid-3">
          <div class="tile"><span class="emoji">🗣️</span>Pair Talk</div>
          <div class="tile"><span class="emoji">🏃</span>Movement</div>
          <div class="tile"><span class="emoji">🎨</span>Crafts</div>
          <div class="tile"><span class="emoji">🧺</span>Senses</div>
          <div class="tile"><span class="emoji">🎮</span>Games</div>
          <div class="tile"><span class="emoji">🏆</span>Certificate</div>
        </div>
      </div>
    `;
  }
});

/* ---- SECTION 14: Activity 1 — Partner Q&A ---- */
addScreen({
  id:"sec14-a1", nav:"Talk",
  badge:{id:"partner", emoji:"🗣️", title:"Friendly Partner!", text:"You practiced greetings with a partner."},
  render(c){
    c.innerHTML = `
      <div class="card">
        <span class="eyebrow">Section 14 · Activity 1</span>
        <h2 class="title">Partner Question &amp; Answer</h2>
        <p class="lead">Tap a card to hear it. Then say it out loud to your partner!</p>
        <div class="grid grid-2" id="talkCards"></div>
        <div class="card" style="background:var(--sky); margin-top:16px; box-shadow:none;">
          <span class="eyebrow">Random Partner Prompt</span>
          <p id="promptText" style="font-size:1.3rem; font-weight:800;">Tap "New Prompt" to start!</p>
          <button class="btn secondary" id="newPrompt">🔀 New Prompt</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="donePartner">✅ We practiced! Get badge</button>
        </div>
      </div>
    `;
    const wrap = c.querySelector("#talkCards");
    GREETINGS.concat(["My name is..."]).forEach(g=>{
      const t = document.createElement("div");
      t.className="tile";
      t.innerHTML = `<span class="emoji">💬</span>${g}`;
      t.addEventListener("click", ()=>{ speak(g); beep(500,0.08); });
      wrap.appendChild(t);
    });
    c.querySelector("#newPrompt").addEventListener("click", ()=>{
      const p = GREETINGS[Math.floor(Math.random()*GREETINGS.length)];
      c.querySelector("#promptText").textContent = p;
      speak(p);
    });
    c.querySelector("#donePartner").addEventListener("click", (e)=>{
      giveReward({stars:2, coins:5, badge:this.badge});
      e.target.disabled = true;
      e.target.textContent = "✅ Great job!";
    });
  }
});

/* ---- SECTION 14: Activity 2 — Picture Card Matching ---- */
addScreen({
  id:"sec14-a2", nav:"Match",
  badge:{id:"matching", emoji:"🧩", title:"Matching Master!", text:"You matched every picture to its word."},
  render(c){
    c.innerHTML = `
      <div class="card">
        <span class="eyebrow">Section 14 · Activity 2</span>
        <h2 class="title">Picture Card Matching</h2>
        <p class="lead">Tap the emoji, then tap the matching word. Match them all!</p>
        <div class="grid grid-2">
          <div>
            <h3 style="margin:6px 0;">Pictures</h3>
            <div class="grid grid-2" id="pics"></div>
          </div>
          <div>
            <h3 style="margin:6px 0;">Words</h3>
            <div class="grid grid-2" id="words"></div>
          </div>
        </div>
        <p id="matchStatus" style="font-weight:700; margin-top:10px;"></p>
      </div>
    `;
    const pool = shuffle(VOCAB).slice(0,6);
    const pics = c.querySelector("#pics"), words = c.querySelector("#words");
    let selectedPic=null, selectedWordEl=null, matchedCount=0;
    const badge = this.badge;
    shuffle(pool).forEach(v=>{
      const t=document.createElement("div"); t.className="tile"; t.dataset.word=v.word;
      t.innerHTML=`<span class="emoji">${v.emoji}</span>`;
      t.addEventListener("click", ()=>{
        if(t.classList.contains("matched")) return;
        pics.querySelectorAll(".tile").forEach(x=>x.classList.remove("selected"));
        t.classList.add("selected"); selectedPic=t;
        speak(v.word);
        tryMatch();
      });
      pics.appendChild(t);
    });
    shuffle(pool).forEach(v=>{
      const t=document.createElement("div"); t.className="tile"; t.dataset.word=v.word;
      t.textContent=v.word;
      t.addEventListener("click", ()=>{
        if(t.classList.contains("matched")) return;
        words.querySelectorAll(".tile").forEach(x=>x.classList.remove("selected"));
        t.classList.add("selected"); selectedWordEl=t;
        tryMatch();
      });
      words.appendChild(t);
    });
    function tryMatch(){
      if(!selectedPic || !selectedWordEl) return;
      if(selectedPic.dataset.word === selectedWordEl.dataset.word){
        selectedPic.classList.add("matched","correct");
        selectedWordEl.classList.add("matched","correct");
        matchedCount++;
        c.querySelector("#matchStatus").textContent = `⭐ Nice job! (${matchedCount}/${pool.length})`;
        successChime();
        if(matchedCount===pool.length){
          giveReward({stars:3, coins:6, badge:badge});
        }
      } else {
        [selectedPic, selectedWordEl].forEach(el=>{
          el.classList.add("wrong");
          setTimeout(()=>el.classList.remove("wrong"), 350);
        });
        errorBuzz();
      }
      selectedPic.classList.remove("selected"); selectedWordEl.classList.remove("selected");
      selectedPic=null; selectedWordEl=null;
    }
  }
});

/* ---- SECTION 15: Activity 1 — Alphabet Adventure ---- */
addScreen({
  id:"sec15-a1", nav:"Move A-B",
  badge:{id:"alphabet", emoji:"🏃", title:"Alphabet Adventurer!", text:"You completed the movement challenge."},
  render(c){
    const challenges = [
      {icon:"🅰️", text:"Jump to letter A!"},
      {icon:"🔵", text:"Touch something blue!"},
      {icon:"👋", text:"Wave to a friend!"},

addScreen({
  id:"sec16-craft", nav:"Craft",
  badge:{id:"craft", emoji:"🎨", title:"Creative Hands!", text:"You made a Hello collage."},
  render(c){
    c.innerHTML = `
      <div class="card">
        <span class="eyebrow">Section 16 · Arts &amp; Crafts</span>
        <h2 class="title">Hello Collage</h2>
        <p class="lead">Drag stickers onto your board to decorate a "Hello" collage!</p>
        <div class="craft-board" id="board"></div>
        <div class="sticker-tray" id="tray"></div>
        <div class="btn-row"><button class="btn" id="craftDone">✅ My Collage is Done!</button></div>
      </div>
    `;
    const board = c.querySelector("#board"), tray = c.querySelector("#tray");
    const stickers = ["⭐","❤️","😊","🌈","👋"];
    const badge = this.badge;
    let placedCount = 0;
    stickers.forEach(s=>{
      const src = document.createElement("div");
      src.className = "sticker-source"; src.textContent = s;
      addDragToPlace(src, s);
      tray.appendChild(src);
    });
    function addDragToPlace(src, emoji){
      function place(x,y){
        const rect = board.getBoundingClientRect();
        if(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom) return;
        const el = document.createElement("div");
        el.className="sticker"; el.textContent=emoji;
        el.style.left = (x-rect.left-16)+"px";
        el.style.top = (y-rect.top-16)+"px";
        board.appendChild(el);
        placedCount++; beep(700,0.08);
      }
      src.addEventListener("pointerdown", (e)=>{
        e.preventDefault();
        const ghost = document.createElement("div");
        ghost.textContent = emoji; ghost.style.position="fixed";
        ghost.style.fontSize="2rem"; ghost.style.pointerEvents="none"; ghost.style.zIndex=999;
        ghost.style.left=(e.clientX-16)+"px"; ghost.style.top=(e.clientY-16)+"px";
        document.body.appendChild(ghost);
        function move(ev){ ghost.style.left=(ev.clientX-16)+"px"; ghost.style.top=(ev.clientY-16)+"px"; }
        function up(ev){
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", up);
          ghost.remove();
          place(ev.clientX, ev.clientY);
        }
        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", up);
      });
    }
    c.querySelector("#craftDone").addEventListener("click", ()=>{
      if(placedCount<3){ errorBuzz(); alert("Add at least 3 stickers first! 🎨"); return; }
      giveReward({stars:2, coins:5, badge:badge});
    });
  }
});

addScreen({
  id:"sec18-g3", nav:"Game 3",
  badge:{id:"trace", emoji:"✍️", title:"Tracing Star!", text:"You traced letters A and B."},
  render(c){
    const badge = this.badge;
    c.innerHTML = `
      <div class="card">
        <span class="eyebrow">Section 18 · Game 3</span>
        <h2 class="title">Trace and Write</h2>
        <p class="lead">Use your finger or mouse to trace the letter below.</p>
        <div class="pillrow" style="margin-bottom:10px;">
          <button class="btn secondary" id="letterA">Letter A</button>
          <button class="btn secondary" id="letterB">Letter B</button>
          <button class="btn ghost" id="clearTrace">Clear</button>
        </div>
        <canvas class="traceboard" id="traceCanvas" width="340" height="220"></canvas>
        <div class="btn-row"><button class="btn" id="traceDone">✅ I traced it!</button></div>
      </div>
    `;
    const canvas = c.querySelector("#traceCanvas");
    const ctx = canvas.getContext("2d");
    let currentLetter = "A";
    function drawGuide(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = "#E3D9FF"; ctx.lineWidth = 18; ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.font = "180px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.strokeText(currentLetter, canvas.width/2, canvas.height/2+10);
    }
    drawGuide();
    let drawing=false;
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {x:(clientX-rect.left)*(canvas.width/rect.width), y:(clientY-rect.top)*(canvas.height/rect.height)};
    }
    function start(e){ drawing=true; ctx.strokeStyle = "#FF9E80"; ctx.lineWidth = 6; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
    function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
    function end(){ drawing=false; }
    canvas.addEventListener("pointerdown", start);
    canvas.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    c.querySelector("#letterA").addEventListener("click", ()=>{ currentLetter="A"; drawGuide(); });
    c.querySelector("#letterB").addEventListener("click", ()=>{ currentLetter="B"; drawGuide(); });
    c.querySelector("#clearTrace").addEventListener("click", drawGuide);
    c.querySelector("#traceDone").addEventListener("click", ()=>{
      giveReward({stars:2, coins:4, badge:badge});
    });
  }
});

      c.querySelector("#soundPrompt").textContent = `Choose the picture for: ${it.say}`;
      area.innerHTML="";
      shuffle(it.options).forEach(o=>{
        const t = document.createElement("div"); t.className="tile"; t.style.fontSize="2rem";
        t.textContent = o.icon;
        t.addEventListener("click", ()=>{
          if(o.correct){ t.classList.add("correct"); correctCount++; successChime(); }
          else { t.classList.add("wrong"); errorBuzz(); }
          setTimeout(()=>{ idx++; renderItem(); }, 500);
        });
        area.appendChild(t);
      });
    }
    c.querySelector("#hearSound").addEventListener("click", ()=>{ speak(items[Math.min(idx,items.length-1)].say); });
    renderItem();
  }
});

/* ---- SECTION 21: Assessment Checklist ---- */
addScreen({
  id:"sec21", nav:"Checklist",
  render(c){
    const items = [
      "Recognizes at least 12 of 19 vocabulary words",
      "Can say Hello expressions independently",

      "Recognizes Letter A, Letter B, and beginning sounds",
      "Participates actively in Pair Activities",
      "Participates actively in Movement Games",
      "Participates actively in Arts & Crafts",
      "Participates actively in Sensory Activities",
      "Participates actively in Digital Activities"
    ];
    c.innerHTML = `
      <div class="card">
        <span class="eyebrow">Section 21 · Assessment</span>
        <h2 class="title">Teacher Checklist</h2>
        <p class="lead">Tap each box to mark it complete for this learner.</p>
        <div id="checklist"></div>
        <div class="progressbar-outer" style="margin-top:14px;"><div class="progressbar-inner" id="assessBar"></div></div>
        <p style="margin-top:8px; font-weight:700;" id="assessPct">0% complete</p>
      </div>
      <div class="card">
        <span class="eyebrow">Festival Progress</span>
        <h2 class="title">Badges Unlocked</h2>
        <div class="grid grid-3" id="badgeShelf"></div>

      </div>
    `;
    const list = c.querySelector("#checklist");
    let checked=0;
    items.forEach((label,i)=>{
      const row = document.createElement("div"); row.className="checklist-item";
      row.innerHTML = `<div class="checkbox" id="chk${i}">✓</div><div>${label}</div>`;
      const box = row.querySelector(".checkbox"); box.style.opacity="0.25";
      row.addEventListener("click", ()=>{
        const isChecked = box.classList.toggle("checked");
        box.style.opacity = isChecked?"1":"0.25";
        checked += isChecked?1:-1;
        const pct = Math.round(checked/items.length*100);
        c.querySelector("#assessBar").style.width = pct+"%";
        c.querySelector("#assessPct").textContent = pct+"% complete";
        beep(isChecked?650:300,0.08);
        if(pct===100){
          confetti(60);

      });
      list.appendChild(row);
    });
    const shelf = c.querySelector("#badgeShelf");
    const allBadges = screens.filter(s=>s.badge).map(s=>s.badge);
    allBadges.forEach(b=>{
      const earned = state.badges.includes(b.id);
      const t = document.createElement("div"); t.className="tile"; t.style.opacity = earned?"1":"0.3";
      t.innerHTML = `<span class="emoji">${b.emoji}</span>${b.title.replace("!","")}`;
      shelf.appendChild(t);
    });
  }
});

/* ============ HELPERS ============ */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============ NAVIGATION ============ */
const appEl = document.getElementById("app");
const garland = document.getElementById("garland");
screens.forEach((s,i)=>{
  const f = document.createElement("div"); f.className="flag"; f.textContent=(i+1);
  f.title = s.nav;
  f.addEventListener("click", ()=>goToScreen(i));
  garland.appendChild(f);
});

function goToScreen(i){
  state.screenIndex = Math.max(0, Math.min(screens.length-1, i));
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function render(){
  appEl.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className="screen active";
  appEl.appendChild(wrap);
  const s = screens[state.screenIndex];
  s.render.call(s, wrap);
  [...garland.children].forEach((f,idx)=>{
    f.classList.toggle("current", idx===state.screenIndex);
    f.classList.toggle("done", idx<state.screenIndex);
  });
  document.getElementById("prevBtn").disabled = state.screenIndex===0;
  document.getElementById("nextBtn").textContent = state.screenIndex===screens.length-1 ? "🎉 Finish" : "Next →";
}
document.getElementById("prevBtn").addEventListener("click", ()=>goToScreen(state.screenIndex-1));
document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(state.screenIndex===screens.length-1){ confetti(60); return; }
  goToScreen(state.screenIndex+1);
});

render();
})();
</script>
