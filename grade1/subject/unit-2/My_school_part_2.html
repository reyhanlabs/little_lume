<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LittleLume English — Let's Count & Listen! (Unit 2, Part 2)</title>
<style>
/* ============================================================
   LITTLELUME ENGLISH — DESIGN TOKENS
   Palette: sky #BFE7F7, mint #BEEFD9, sun #FFE49C, peach #FFD2AE,
            bubble #FFC7DE, grape #DCC8F7, ink #33405C, cloud #FFFDF9
   Type: rounded, chunky, friendly system stack (offline-safe)
   Signature: the "Glowing School Map" that tears/rebuilds as levels
              are completed — visible in the HUD at all times.
   ============================================================ */
:root{
  --sky:#BFE7F7; --mint:#BEEFD9; --sun:#FFE49C; --peach:#FFD2AE;
  --bubble:#FFC7DE; --grape:#DCC8F7; --ink:#33405C; --ink-soft:#5A6690;
  --cloud:#FFFDF9; --coin:#FFC94D; --star:#FFD23F; --heart:#FF6B8B;
  --good:#5FCB8B; --shadow: 0 10px 24px rgba(51,64,92,.18);
  --radius: 26px;
  --font: 'Trebuchet MS','Segoe UI Rounded','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #fff 0%, transparent 40%),
    radial-gradient(circle at 90% 85%, var(--grape) 0%, transparent 45%),
    linear-gradient(160deg, var(--sky) 0%, var(--mint) 55%, var(--sun) 100%);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
#app{max-width:980px;margin:0 auto;padding:12px 14px 140px;position:relative;}

/* ---------- HUD ---------- */
#hud{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px;
  background:rgba(255,253,249,.9);
  backdrop-filter:blur(6px);
  border-radius:20px; padding:8px 12px; margin:8px 0 12px;
  box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:var(--ink);}
.brand small{display:block; font-weight:600; font-size:10px; color:var(--ink-soft); letter-spacing:.5px;}
.hud-stat{display:flex; align-items:center; gap:4px; font-weight:800; font-size:14px; background:#fff; border-radius:14px; padding:4px 10px; box-shadow:0 2px 6px rgba(51,64,92,.12);}
.hud-map{margin-left:auto; display:flex; gap:3px;}
.mapPiece{width:16px;height:16px;border-radius:5px;background:#eee;transition:.4s;}
.mapPiece.on{background:var(--star); box-shadow:0 0 8px var(--star);}
#progressWrap{position:sticky; top:56px; z-index:49; margin:-6px 0 10px;}
#progressBar{height:10px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.15);}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--heart),var(--coin),var(--good));transition:width .6s cubic-bezier(.4,1.6,.5,1);}

/* ---------- STAGE ---------- */
.card{
  background:var(--cloud); border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden;
}
.scene-title{font-size:22px; font-weight:800; margin:0 0 4px; color:var(--ink);}
.scene-sub{font-size:14px; color:var(--ink-soft); margin:0 0 14px; font-weight:600;}
.pillrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}

/* ---------- BUTTONS ---------- */
button{font-family:var(--font); cursor:pointer; border:none;}
.btn{
  background:linear-gradient(180deg,#fff,#f2f2f2); color:var(--ink); font-weight:800;
  padding:12px 20px; border-radius:18px; font-size:15px; box-shadow:0 5px 0 #d7d7d7,var(--shadow);
  transition:transform .12s;
}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #d7d7d7;}
.btn.primary{background:linear-gradient(180deg,#7FD8A6,var(--good)); color:#fff; box-shadow:0 5px 0 #3fa869;}
.btn.primary:active{box-shadow:0 1px 0 #3fa869;}
.btn.accent{background:linear-gradient(180deg,#FFB870,#FF9A45); color:#fff; box-shadow:0 5px 0 #d97a25;}
.btn.accent:active{box-shadow:0 1px 0 #d97a25;}
.btn.sound{background:linear-gradient(180deg,#8FCBEF,#5FA8DE); color:#fff; box-shadow:0 5px 0 #3a7cb0; font-size:13px; padding:9px 14px;}
.btn.sound:active{box-shadow:0 1px 0 #3a7cb0;}
.btn:disabled{opacity:.45; cursor:default;}
.bigbtn{display:block; width:100%; padding:18px; font-size:18px; border-radius:22px;}

/* ---------- LUMI MASCOT ---------- */
#lumiBar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:flex; align-items:flex-end; gap:10px;
  padding:10px 14px 14px; max-width:980px; margin:0 auto;
}
#lumiWrap{flex:0 0 auto; animation:lumiFloat 3s ease-in-out infinite;}
@keyframes lumiFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-8px) rotate(2deg);}}
#lumiBubble{
  flex:1; background:#fff; border-radius:20px; padding:12px 16px; box-shadow:var(--shadow);
  font-weight:700; font-size:14.5px; min-height:20px; position:relative;
}
#lumiBubble:after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;}

/* ---------- ACTIVITY GRIDS ---------- */
.grid{display:grid; gap:12px;}
.grid.cols2{grid-template-columns:repeat(2,1fr);}
.grid.cols3{grid-template-columns:repeat(3,1fr);}
.grid.cols4{grid-template-columns:repeat(4,1fr);}
@media (max-width:560px){.grid.cols3{grid-template-columns:repeat(2,1fr);} .grid.cols4{grid-template-columns:repeat(2,1fr);}}

.tile{
  background:#fff; border-radius:18px; padding:10px; text-align:center; box-shadow:0 4px 10px rgba(51,64,92,.1);
  border:3px solid transparent; transition:.15s; position:relative;
}
.tile.clickable:hover{transform:translateY(-3px);}
.tile.selected{border-color:var(--sun); background:#FFF7DF;}
.tile.correct{border-color:var(--good); background:#E9FBF0;}
.tile.wrong{border-color:var(--heart); animation:shake .3s;}
.tile.done{opacity:.55;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.tile .word{font-weight:800; font-size:14px; margin-top:4px;}
.tile svg{width:100%; height:auto; max-height:70px;}

/* ---------- CHIPS (sentence builder) ---------- */
.chipzone{min-height:56px; border:3px dashed #ccc; border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#fafafa;}
.chip{background:var(--grape); color:var(--ink); font-weight:800; padding:8px 14px; border-radius:14px; box-shadow:0 3px 0 rgba(0,0,0,.1);}
.chip.bank{background:#fff; border:2px solid var(--grape);}
.chip.placed{background:var(--good); color:#fff;}

/* ---------- CONFETTI / SPARKLE ---------- */
#fxLayer{position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden;}
.confetti{position:absolute; top:-20px; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.9;}}
.floatText{position:fixed; z-index:210; font-weight:900; font-size:22px; pointer-events:none; animation:floatUp 1.1s ease-out forwards;}
@keyframes floatUp{0%{opacity:0; transform:translateY(10px) scale(.7);}20%{opacity:1; transform:translateY(-6px) scale(1.15);}100%{opacity:0; transform:translateY(-70px) scale(1);}}

/* ---------- BADGE SHELF ---------- */
.badgeShelf{display:flex; gap:10px; flex-wrap:wrap;}
.badgeItem{width:64px; text-align:center; font-size:10px; font-weight:800; position:relative;}
.badgeItem svg{width:56px; height:56px;}
.badgeItem.special .badgeInner{animation:heroGlow 1.3s ease-in-out infinite;}
@keyframes heroGlow{0%,100%{filter:drop-shadow(0 0 3px var(--star)); transform:scale(1);}50%{filter:drop-shadow(0 0 14px var(--star)); transform:scale(1.1);}}
.badgeItem.special .newTag{position:absolute; top:-8px; right:0; background:var(--heart); color:#fff; font-size:8px; font-weight:900; padding:2px 6px; border-radius:8px; transform:rotate(8deg); box-shadow:0 2px 4px rgba(0,0,0,.2);}

/* ---------- PHOTO WITH LUMI ---------- */
.photoFrame{background:#fff; border-radius:10px; padding:12px 12px 30px; max-width:250px; margin:16px auto; box-shadow:var(--shadow); transform:rotate(-2deg);}
.photoInner{background:linear-gradient(160deg,var(--sky),var(--grape)); border-radius:6px; display:flex; align-items:center; justify-content:center; gap:10px; padding:18px 8px; min-height:100px;}
.photoFrame .cap{margin-top:8px; font-weight:800; font-size:12.5px; color:var(--ink-soft); text-align:center;}

/* ---------- FIREWORKS ---------- */
.firework{position:absolute; border-radius:50%; animation:fwPart .9s ease-out forwards; pointer-events:none;}
@keyframes fwPart{0%{transform:translate(0,0) scale(1); opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0;}}

/* ---------- START SCREEN ---------- */
#startScreen{text-align:center; padding:30px 14px;}
#startScreen h1{font-size:28px; margin:6px 0 2px;}
#startScreen .tagline{color:var(--ink-soft); font-weight:700; margin-bottom:18px;}
#nameInput{font-family:var(--font); font-size:18px; font-weight:700; padding:12px 16px; border-radius:16px; border:3px solid var(--grape); text-align:center; width:80%; max-width:320px;}

/* ---------- misc ---------- */
.hidden{display:none !important;}
.center{text-align:center;}
.small{font-size:12px; color:var(--ink-soft);}
.rowbtns{display:flex; gap:10px; flex-wrap:wrap;}
.mouthbox{display:flex; justify-content:center; margin:10px 0;}
.progressMini{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:8px;}
.progressMini > div{height:100%;background:var(--good);transition:width .4s;}
.lyricLine{font-size:20px; font-weight:800; text-align:center; padding:6px;}
.lyricLine span{padding:2px 4px; border-radius:6px;}
.lyricLine span.active{background:var(--sun); color:var(--ink);}
#karaokeBall{width:14px;height:14px;border-radius:50%;background:var(--heart);margin:0 auto;transition:transform .25s;}
.mapStage{width:100%; max-width:520px; margin:10px auto; display:block;}
.tprSpot{cursor:pointer;}
.certWrap{border:6px solid var(--sun); border-radius:20px; padding:24px; text-align:center; background:linear-gradient(180deg,#fff,#FFF8E9);}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#FFE49C"/><circle cx="50" cy="46" r="20" fill="#FFC94D"/><circle cx="42" cy="42" r="4" fill="#33405C"/><circle cx="58" cy="42" r="4" fill="#33405C"/><path d="M40 54 Q50 62 60 54" stroke="#33405C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M30 30 Q20 10 35 15" stroke="#FFD2AE" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M70 30 Q80 10 65 15" stroke="#FFD2AE" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
      <div>LittleLume English<small>Learn • Play • Shine</small></div>
    </div>
    <div class="hud-stat">⭐ <span id="statStars">0</span></div>
    <div class="hud-stat">🪙 <span id="statCoins">0</span></div>
    <div class="hud-stat">❤️ <span id="statHearts">0</span></div>
    <div class="hud-stat">XP <span id="statXP">0</span></div>
    <div class="hud-map" id="hudMap"></div>
  </div>
  <div id="progressWrap"><div id="progressBar"><div id="progressFill"></div></div></div>

  <div id="stage"></div>
</div>

<div id="lumiBar">
  <div id="lumiWrap">
    <svg width="58" height="58" viewBox="0 0 100 100">
      <ellipse cx="30" cy="34" rx="22" ry="14" fill="#FFD2AE" opacity=".85" transform="rotate(-20 30 34)"/>
      <ellipse cx="70" cy="34" rx="22" ry="14" fill="#DCC8F7" opacity=".85" transform="rotate(20 70 34)"/>
      <circle cx="50" cy="55" r="30" fill="#FFC94D"/>
      <circle cx="42" cy="50" r="5" fill="#33405C"/><circle cx="58" cy="50" r="5" fill="#33405C"/>
      <path d="M40 62 Q50 70 60 62" stroke="#33405C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="50" cy="86" r="6" fill="#FFE49C"/>
    </svg>
  </div>
  <div id="lumiBubble">Hi again! I'm Lumi! Tap Start for our next school adventure!</div>
</div>

<div id="fxLayer"></div>

<script>
/* ============================================================
   LITTLELUME ENGLISH — GRADE 1, UNIT 2 PART 2 "LET'S COUNT & LISTEN!"
   Continues the Part 1 story: same map-rebuilding adventure with Lumi,
   now teaching classroom commands and numbers 1-10.
   Self-contained interactive lesson engine.
   No external libraries, fonts, images or network calls.
   Sound: Web Audio API (chimes) + built-in SpeechSynthesis (words).
   ============================================================ */

/* ---------------------- STATE ---------------------- */
const state = {
  stars:0, coins:0, hearts:0, xp:0,
  badges:[], name:'', level:0, completion:0
};

/* ---------------------- RETURNING PLAYER (from Part 1) ---------------------- */
function getReturningPlayer(){
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  if(!name) return null;
  return { name, stars: parseInt(params.get('stars')||'0',10)||0, coins: parseInt(params.get('coins')||'0',10)||0 };
}
const returningPlayer = getReturningPlayer();

/* ---------------------- AUDIO ---------------------- */
let actx = null;
function audioCtx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function tone(freq, start, dur, type='sine', vol=.18){
  const ctx = audioCtx();
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, ctx.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+start); o.stop(ctx.currentTime+start+dur+0.05);
}
function sfxClick(){ tone(520,0,.08,'triangle',.12); }
function sfxCorrect(){ tone(523,0,.12,'sine'); tone(659,.1,.12,'sine'); tone(784,.2,.18,'sine'); }
function sfxWrong(){ tone(220,0,.15,'sawtooth',.1); tone(180,.12,.18,'sawtooth',.1); }
function sfxLevelUp(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.22,'sine',.16)); }
function sfxCoin(){ tone(988,0,.06,'square',.1); tone(1318,.06,.1,'square',.1); }
let karaokeTimers=[];
function stopKaraoke(){ karaokeTimers.forEach(t=>clearTimeout(t)); karaokeTimers=[]; }

let voices=[];
function loadVoices(){ voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text, rate=0.95){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate; u.pitch = 1.15; u.lang='en-US';
  const v = voices.find(v=>/en/i.test(v.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------------------- FX: confetti / floating text ---------------------- */
const fxLayer = document.getElementById('fxLayer');
const confettiColors = ['#FF6B8B','#FFC94D','#5FCB8B','#8FCBEF','#DCC8F7','#FFB870'];
function confettiBurst(n=40){
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className='confetti';
    const size = 6+Math.random()*6;
    el.style.width=size+'px'; el.style.height=(size*.6)+'px';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    el.style.animationDuration = (1.6+Math.random()*1.4)+'s';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    fxLayer.appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }
}
function floatText(txt, x, y, color='#FFC94D'){
  const el = document.createElement('div');
  el.className='floatText'; el.textContent=txt; el.style.color=color;
  el.style.left = x+'px'; el.style.top = y+'px';
  fxLayer.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}
function burstFrom(evt, txt, color){
  let x = window.innerWidth/2, y = window.innerHeight/2;
  if(evt && evt.currentTarget){ const r = evt.currentTarget.getBoundingClientRect(); x=r.left+r.width/2; y=r.top; }
  floatText(txt, x-20, y, color);
}
function fireworkAt(x,y){
  for(let i=0;i<22;i++){
    const el = document.createElement('div');
    el.className='firework';
    const angle = (Math.PI*2*i)/22;
    const dist = 50+Math.random()*70;
    el.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    el.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    el.style.left = x+'px'; el.style.top = y+'px';
    const size = 4+Math.random()*4;
    el.style.width = size+'px'; el.style.height = size+'px';
    el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    fxLayer.appendChild(el);
    setTimeout(()=>el.remove(), 950);
  }
}
function fireworksShow(){
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const x = window.innerWidth*(0.15+Math.random()*0.7);
      const y = window.innerHeight*(0.15+Math.random()*0.35);
      fireworkAt(x,y);
      tone(500+Math.random()*500, 0, .25, 'sine', .12);
    }, i*380);
  }
}

/* ---------------------- REWARD HELPERS ---------------------- */
function giveStars(n, evt){ state.stars+=n; sfxCorrect(); confettiBurst(14); burstFrom(evt, '+'+n+' ⭐', '#FFC94D'); updateHUD(); }
function giveCoins(n, evt){ state.coins+=n; sfxCoin(); burstFrom(evt, '+'+n+' 🪙', '#E39A00'); updateHUD(); }
function giveHearts(n, evt){ state.hearts+=n; burstFrom(evt, '+'+n+' ❤️', '#FF6B8B'); updateHUD(); }
function giveXP(n){ state.xp+=n; updateHUD(); }
function wrongFeedback(){ sfxWrong(); }
function updateHUD(){
  document.getElementById('statStars').textContent = state.stars;
  document.getElementById('statCoins').textContent = state.coins;
  document.getElementById('statHearts').textContent = state.hearts;
  document.getElementById('statXP').textContent = state.xp;
  const pct = Math.min(100, Math.round((state.level*20) + (state.completion*20)));
  document.getElementById('progressFill').style.width = pct+'%';
  const map = document.getElementById('hudMap'); map.innerHTML='';
  for(let i=1;i<=5;i++){
    const d = document.createElement('div');
    d.className='mapPiece'+(state.level>i-1 || (state.level===i-1 && state.completion>=1)?' on':'');
    map.appendChild(d);
  }
}
function lumiSay(txt){ document.getElementById('lumiBubble').textContent = txt; speak(txt); }
function lumiSayQuiet(txt){ document.getElementById('lumiBubble').textContent = txt; }

/* ---------------------- ICON LIBRARY (clear emoji icons) ---------------------- */
function badge(bg, inner){ return `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="4" y="4" width="92" height="92" rx="22" fill="${bg}"/>${inner}</svg>`; }
const ICONS = {
  school: '🏫', classroom: badge('#FFE49C', `<rect x="14" y="18" width="72" height="54" rx="6" fill="#fff" stroke="#F2C879" stroke-width="3"/><rect x="24" y="26" width="34" height="20" rx="3" fill="#2E5C4A"/><path d="M30 34 h10 M30 40 h18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><rect x="64" y="30" width="14" height="12" rx="2" fill="#8FCBEF"/><rect x="24" y="54" width="16" height="12" rx="2" fill="#FF9A45"/><rect x="46" y="54" width="16" height="12" rx="2" fill="#FF9A45"/>`),
  teacher: '🧑\u200d🏫', principal: '🧑\u200d💼',
  friend: '🧑\u200d🤝\u200d🧑', desk: '🗄️', chair: '🪑', board: badge('#DCEEF9', `<rect x="14" y="16" width="72" height="48" rx="6" fill="#fff" stroke="#5FA8DE" stroke-width="4"/><path d="M24 30 h24 M24 40 h34 M24 50 h20" stroke="#33405C" stroke-width="3" stroke-linecap="round"/><rect x="30" y="64" width="40" height="8" rx="3" fill="#C08A54"/><circle cx="38" cy="68" r="3" fill="#FF6B8B"/><circle cx="50" cy="68" r="3" fill="#5FA8DE"/><circle cx="62" cy="68" r="3" fill="#5FCB8B"/>`),
  bag: '🎒', book: '📘', pencil: '✏️', crayon: '🖍️', ruler: '📏',
  scissors: '✂️', glue: '🧴', playground: '🛝', library: '📚',
  canteen: '🍽️', toilet: '🚻', bell: '🔔', map: '🗺️', star: '⭐',
  coin: '🪙', heart: '❤️', net: '🥅', owl: '🦉', pen: '🖊️',
  queen: '👑', run: '🏃', sun: '☀️', top: '🔝', umbrella: '☂️',
  van: '🚐', web: '🕸️', box: '📦', yoyo: '🪀', zip: '🤐',
  lumi: '🐝', mouth: '👄', seal: '🏅',
  standup: '🧍', sitdown: '🪑', listen: '👂', look: '👀',
  openbook: '📖', closebook: '📕', lineup: '🚶', quiet: '🤫', raisehand: '✋',
  dio: '🧒',
  one: '1️⃣', two: '2️⃣', three: '3️⃣', four: '4️⃣', five: '5️⃣',
  six: '6️⃣', seven: '7️⃣', eight: '8️⃣', nine: '9️⃣', ten: '🔟',
};
function ic(key,size=64){
  const val = ICONS[key]||ICONS.star;
  if(typeof val==='string' && val.trim().startsWith('<')){
    return `<div style="width:${size}px;height:${size}px;margin:0 auto;">${val}</div>`;
  }
  return `<span style="font-size:${size}px;line-height:1;display:inline-block;">${val}</span>`;
}

function levelProgressFraction(){

}

  state.level = curLevel; state.completion = levelProgressFraction();

}

  const lvl = LEVELS[curLevel];

  const lvl = LEVELS[curLevel];

    case 'chant': return renderChant(act);

/* ---------------------- ACTIVITY: SENTENCE BUILDER ---------------------- */
function renderSentence(act){
  let idx=0;
  function newRound(){
    if(idx>=act.items.length){ giveStars(2); nextActivity(); return; }
    const item = act.items[idx];
    const words = item.s.replace('.','').split(' ');
    const bank = shuffle(words);
    let placed = [];
    stageEl.innerHTML = `
    <div class="card center">
      <div class="scene-title">🧩 Sentence Builder</div>
      <div class="scene-sub">Sentence ${idx+1} of ${act.items.length} — tap the words in order!</div>
      ${ic(item.i,70)}
      <div class="chipzone" id="sentTarget"></div>
      <div class="chipzone" id="sentBank" style="margin-top:10px;"></div>
      <button class="btn accent" style="margin-top:10px;" onclick="resetSentence()">↺ Reset</button>
    </div>`;
    function render(){
      document.getElementById('sentTarget').innerHTML = placed.map(w=>`<span class="chip placed">${w}</span>`).join('') || '<span class="small">Tap words below in order…</span>';
      document.getElementById('sentBank').innerHTML='';
      const bankEl = document.getElementById('sentBank');
      bank.forEach((w,i)=>{
        if(placed.includes(w) && placed.filter(x=>x===w).length > bank.slice(0,i).filter(x=>x===w).length && placed.indexOf(w)>-1){}
      });
      const used = [...placed];
      const remaining = [...bank];
      used.forEach(w=>{ const pos = remaining.indexOf(w); if(pos>-1) remaining.splice(pos,1); });
      remaining.forEach(w=>{
        const c = document.createElement('span'); c.className='chip bank'; c.textContent=w;
        c.onclick=()=>{ placed.push(w); sfxClick(); checkDone(); render(); };
        bankEl.appendChild(c);
      });
    }
    window.resetSentence = ()=>{ placed=[]; render(); };
    function checkDone(){
      if(placed.length===words.length){
        const built = placed.join(' ');
        if(built.toLowerCase()===words.join(' ').toLowerCase()){
          setTimeout(()=>{ giveXP(4); sfxCorrect(); speak(item.s); idx++; setTimeout(newRound,900); },200);
        } else {
          setTimeout(()=>{ wrongFeedback(); placed=[]; render(); },400);
        }
      }
    }
    render();
  }
  newRound();
  lumiSayQuiet("Tap the words in the right order to build the sentence!");
}

/* ---------------------- ACTIVITY: PHONICS ---------------------- */
function renderPhonics(act){
  let idx=0;
  function paint(){
    if(idx>=act.letters.length){ giveStars(2); nextActivity(); return; }
    const L = act.letters[idx];
    stageEl.innerHTML = `
    <div class="card center">
      <div class="scene-title">🔡 Letter ${L.L}${L.L.toLowerCase()}</div>
      <div class="scene-sub">Letter ${idx+1} of ${act.letters.length}</div>
      <div style="font-size:70px; font-weight:900; color:var(--ink);">${L.L}<span style="color:var(--ink-soft);">${L.L.toLowerCase()}</span></div>
      ${ic(L.i,70)}
      <p style="font-weight:800; font-size:16px;">${L.L} is for <u>${L.ex}</u></p>
      <div class="rowbtns center" style="justify-content:center;">
        <button class="btn sound" onclick="speak('${L.L}. ${L.L} is for ${L.ex}.')">🔊 Hear it</button>
        <button class="btn sound" onclick="speak('${L.L}')">🔊 Letter sound</button>
      </div>
      <canvas id="traceCanvas" width="220" height="120" style="background:#fff;border-radius:12px;border:3px dashed var(--grape); margin-top:14px; touch-action:none;"></canvas>
      <div class="small">Trace the letter with your finger or mouse!</div>
      <div class="grid cols2" style="max-width:280px; margin:14px auto 0;" id="matchCase"></div>
    </div>`;
    // tracing
    const cv = document.getElementById('traceCanvas'); const ctx = cv.getContext('2d');
    ctx.font='90px Trebuchet MS'; ctx.fillStyle='#EFE9FB'; ctx.textAlign='center'; ctx.fillText(L.L, 110, 95);
    ctx.strokeStyle='#FF6B8B'; ctx.lineWidth=5; ctx.lineCap='round';
    let drawing=false;
    function pos(e){ const r=cv.getBoundingClientRect(); const p = e.touches? e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; }
    function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
    function move(e){ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
    function end(){ drawing=false; }
    cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);

  let flipped=[]; let matched=new Set(); let lock=false;
  stageEl.innerHTML = `

      function render(){
        document.getElementById('fbT').innerHTML = placed.map(w=>`<span class="chip placed">${w}</span>`).join('')||'<span class="small">Tap in order…</span>';
        const b=document.getElementById('fbB'); b.innerHTML='';
        const rem=[...bank]; placed.forEach(w=>{const p=rem.indexOf(w); if(p>-1) rem.splice(p,1);});
        rem.forEach(w=>{ const c=document.createElement('span'); c.className='chip bank'; c.textContent=w;
          c.onclick=()=>{ placed.push(w); sfxClick(); if(placed.length===q.words.length){ setTimeout(()=>{ if(placed.join(' ')===q.words.join(' ')){ sfxCorrect(); giveXP(5); idx++; paint(); } else { wrongFeedback(); placed=[]; render(); } },300);} else render(); };
          b.appendChild(c); });
      }
      render();
    } else {
      stageEl.innerHTML = `<div class="card center"><div class="scene-title">🛡️ Final Boss Round ${idx+1}/${questions.length}</div><div class="scene-sub">${q.q}</div>${q.type==='pic'?ic(q.target.i,80):''}<div class="grid cols3" id="fbGrid" style="margin-top:12px;"></div></div>`;
      const grid = document.getElementById('fbGrid');
      const opts = q.type==='pic'? q.opts.map(o=>o.w) : q.opts;
      const correct = q.type==='pic'? q.target.w : q.target;
      opts.forEach(w=>{
        const t=document.createElement('div'); t.className='tile clickable'; t.innerHTML=`<div class="word">${w}</div>`;
        t.onclick=()=>{ if(w===correct){ sfxCorrect(); giveXP(5); idx++; setTimeout(paint,500); } else { wrongFeedback(); t.classList.add('wrong'); setTimeout(()=>t.classList.remove('wrong'),400);} };
        grid.appendChild(t);
      });
    }
  }
  paint();
  lumiSay("Final boss time! Show me everything you learned!");
}
