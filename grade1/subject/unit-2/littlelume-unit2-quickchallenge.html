<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LittleLume English — Quick Challenge (Unit 2: This Is My School!)</title>
<style>
/* ============================================================
   LITTLELUME ENGLISH — DESIGN TOKENS (matches Part 1, Part 2 & Notebook)
   ============================================================ */
:root{
  --sky:#BFE7F7; --mint:#BEEFD9; --sun:#FFE49C; --peach:#FFD2AE;
  --bubble:#FFC7DE; --grape:#DCC8F7; --ink:#33405C; --ink-soft:#5A6690;
  --cloud:#FFFDF9; --coin:#FFC94D; --star:#FFD23F; --heart:#FF6B8B;
  --good:#5FCB8B; --shadow: 0 10px 24px rgba(51,64,92,.18);
  --radius: 26px;
  --font: 'Trebuchet MS','Segoe UI Rounded','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #fff 0%, transparent 40%),
    radial-gradient(circle at 90% 85%, var(--grape) 0%, transparent 45%),
    linear-gradient(160deg, var(--sky) 0%, var(--mint) 55%, var(--sun) 100%);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
#app{max-width:980px;margin:0 auto;padding:12px 14px 140px;position:relative;}

/* ---------- HUD ---------- */
#hud{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px;
  background:rgba(255,253,249,.9);
  backdrop-filter:blur(6px);
  border-radius:20px; padding:8px 12px; margin:8px 0 12px;
  box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:var(--ink);}
.brand small{display:block; font-weight:600; font-size:10px; color:var(--ink-soft); letter-spacing:.5px;}
.hud-stat{display:flex; align-items:center; gap:4px; font-weight:800; font-size:14px; background:#fff; border-radius:14px; padding:4px 10px; box-shadow:0 2px 6px rgba(51,64,92,.12);}
.hud-dots{margin-left:auto; display:flex; gap:3px;}
.dotPiece{width:16px;height:16px;border-radius:5px;background:#eee;transition:.4s;}
.dotPiece.on{background:var(--star); box-shadow:0 0 8px var(--star);}
.dotPiece.cur{background:var(--good);}

/* ---------- STAGE ---------- */
.card{
  background:var(--cloud); border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden;
}
.scene-title{font-size:22px; font-weight:800; margin:0 0 4px; color:var(--ink);}
.scene-sub{font-size:14px; color:var(--ink-soft); margin:0 0 14px; font-weight:600;}
.pillrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}

/* ---------- BUTTONS ---------- */
button{font-family:var(--font); cursor:pointer; border:none;}
.btn{
  background:linear-gradient(180deg,#fff,#f2f2f2); color:var(--ink); font-weight:800;
  padding:12px 20px; border-radius:18px; font-size:15px; box-shadow:0 5px 0 #d7d7d7,var(--shadow);
  transition:transform .12s;
}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #d7d7d7;}
.btn.primary{background:linear-gradient(180deg,#7FD8A6,var(--good)); color:#fff; box-shadow:0 5px 0 #3fa869;}
.btn.primary:active{box-shadow:0 1px 0 #3fa869;}
.btn.accent{background:linear-gradient(180deg,#FFB870,#FF9A45); color:#fff; box-shadow:0 5px 0 #d97a25;}
.btn.accent:active{box-shadow:0 1px 0 #d97a25;}
.btn.sound{background:linear-gradient(180deg,#8FCBEF,#5FA8DE); color:#fff; box-shadow:0 5px 0 #3a7cb0; font-size:13px; padding:9px 14px;}
.btn.sound:active{box-shadow:0 1px 0 #3a7cb0;}
.btn.tf{font-size:34px; width:88px; height:88px; border-radius:24px; padding:0;}
.btn.tf.yes{background:linear-gradient(180deg,#7FD8A6,var(--good)); color:#fff; box-shadow:0 5px 0 #3fa869;}
.btn.tf.no{background:linear-gradient(180deg,#FF97AC,var(--heart)); color:#fff; box-shadow:0 5px 0 #d94a68;}
.btn:disabled{opacity:.45; cursor:default;}
.bigbtn{display:block; width:100%; padding:18px; font-size:18px; border-radius:22px;}

/* ---------- LUMI MASCOT ---------- */
#lumiBar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:flex; align-items:flex-end; gap:10px;
  padding:10px 14px 14px; max-width:980px; margin:0 auto;
}
#lumiWrap{flex:0 0 auto; animation:lumiFloat 3s ease-in-out infinite;}
@keyframes lumiFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-8px) rotate(2deg);}}
#lumiBubble{
  flex:1; background:#fff; border-radius:20px; padding:12px 16px; box-shadow:var(--shadow);
  font-weight:700; font-size:14.5px; min-height:20px; position:relative;
}
#lumiBubble:after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;}

/* ---------- ACTIVITY GRIDS ---------- */
.grid{display:grid; gap:12px;}
.grid.cols2{grid-template-columns:repeat(2,1fr);}
.grid.cols3{grid-template-columns:repeat(3,1fr);}
.grid.cols4{grid-template-columns:repeat(4,1fr);}
.grid.cols5{grid-template-columns:repeat(5,1fr);}
@media (max-width:640px){.grid.cols3{grid-template-columns:repeat(2,1fr);} .grid.cols4{grid-template-columns:repeat(2,1fr);} .grid.cols5{grid-template-columns:repeat(3,1fr);}}

.tile{
  background:#fff; border-radius:18px; padding:10px; text-align:center; box-shadow:0 4px 10px rgba(51,64,92,.1);
  border:3px solid transparent; transition:.15s; position:relative;
}
.tile.clickable:hover{transform:translateY(-3px);}
.tile.correct{border-color:var(--good); background:#E9FBF0;}
.tile.wrong{border-color:var(--heart); animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.tile .word{font-weight:800; font-size:14px; margin-top:4px;}
.tile svg{width:100%; height:auto; max-height:70px;}

/* ---------- CHIPS (sentence race) ---------- */
.chipzone{min-height:56px; border:3px dashed #ccc; border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#fafafa;}
.chip{background:var(--grape); color:var(--ink); font-weight:800; padding:8px 14px; border-radius:14px; box-shadow:0 3px 0 rgba(0,0,0,.1);}
.chip.bank{background:#fff; border:2px solid var(--grape);}
.chip.placed{background:var(--good); color:#fff;}

/* ---------- TIMER ---------- */
.timerWrap{max-width:320px; margin:12px auto 4px;}
.timerBar{height:14px;background:#eee;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.15);}
.timerFill{height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--coin),var(--heart));transition:width 1s linear;}
.timerNum{text-align:center; font-weight:900; font-size:13px; color:var(--ink-soft); margin-top:4px;}

/* ---------- CONFETTI / SPARKLE / FIREWORKS ---------- */
#fxLayer{position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden;}
.confetti{position:absolute; top:-20px; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.9;}}
.floatText{position:fixed; z-index:210; font-weight:900; font-size:22px; pointer-events:none; animation:floatUp 1.1s ease-out forwards;}
@keyframes floatUp{0%{opacity:0; transform:translateY(10px) scale(.7);}20%{opacity:1; transform:translateY(-6px) scale(1.15);}100%{opacity:0; transform:translateY(-70px) scale(1);}}
.firework{position:absolute; border-radius:50%; animation:fwPart .9s ease-out forwards; pointer-events:none;}
@keyframes fwPart{0%{transform:translate(0,0) scale(1); opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0;}}

/* ---------- BADGE / CERTIFICATE ---------- */
.badgeShelf{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.badgeItem{width:80px; text-align:center; font-size:11px; font-weight:800; position:relative;}
.badgeItem svg,.badgeItem span{font-size:56px;}
.badgeItem .badgeInner{animation:heroGlow 1.3s ease-in-out infinite;}
@keyframes heroGlow{0%,100%{filter:drop-shadow(0 0 3px var(--star)); transform:scale(1);}50%{filter:drop-shadow(0 0 14px var(--star)); transform:scale(1.1);}}
.certWrap{border:6px solid var(--sun); border-radius:20px; padding:24px; text-align:center; background:linear-gradient(180deg,#fff,#FFF8E9);}

/* ---------- START SCREEN ---------- */
#startScreen{text-align:center; padding:26px 14px;}
#startScreen h1{font-size:26px; margin:6px 0 2px;}
#startScreen .tagline{color:var(--ink-soft); font-weight:700; margin-bottom:14px;}
#nameInput{font-family:var(--font); font-size:18px; font-weight:700; padding:12px 16px; border-radius:16px; border:3px solid var(--grape); text-align:center; width:80%; max-width:320px;}
.previewRow{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:16px 0;}
.previewChip{background:#fff; border-radius:16px; padding:8px 12px; font-size:12px; font-weight:800; box-shadow:0 3px 8px rgba(51,64,92,.1);}

/* ---------- misc ---------- */
.hidden{display:none !important;}
.center{text-align:center;}
.small{font-size:12px; color:var(--ink-soft);}
.rowbtns{display:flex; gap:10px; flex-wrap:wrap;}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#FFE49C"/><circle cx="50" cy="46" r="20" fill="#FFC94D"/><circle cx="42" cy="42" r="4" fill="#33405C"/><circle cx="58" cy="42" r="4" fill="#33405C"/><path d="M40 54 Q50 62 60 54" stroke="#33405C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M30 30 Q20 10 35 15" stroke="#FFD2AE" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M70 30 Q80 10 65 15" stroke="#FFD2AE" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
      <div>LittleLume English<small>Quick Challenge · Unit 2</small></div>
    </div>
    <div class="hud-stat">⭐ <span id="statStars">0</span></div>
    <div class="hud-stat">🪙 <span id="statCoins">0</span></div>
    <div class="hud-dots" id="hudDots"></div>
  </div>

  <div id="stage"></div>
</div>

<div id="lumiBar">
  <div id="lumiWrap">
    <svg width="58" height="58" viewBox="0 0 100 100">
      <ellipse cx="30" cy="34" rx="22" ry="14" fill="#FFD2AE" opacity=".85" transform="rotate(-20 30 34)"/>
      <ellipse cx="70" cy="34" rx="22" ry="14" fill="#DCC8F7" opacity=".85" transform="rotate(20 70 34)"/>
      <circle cx="50" cy="55" r="30" fill="#FFC94D"/>
      <circle cx="42" cy="50" r="5" fill="#33405C"/><circle cx="58" cy="50" r="5" fill="#33405C"/>
      <path d="M40 62 Q50 70 60 62" stroke="#33405C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="50" cy="86" r="6" fill="#FFE49C"/>
    </svg>
  </div>
  <div id="lumiBubble">Hi! I'm Lumi! Ready for a Quick Challenge?</div>
</div>

<div id="fxLayer"></div>

<script>
/* ============================================================
   LITTLELUME ENGLISH — UNIT 2 "THIS IS MY SCHOOL!" QUICK CHALLENGE
   Standalone review/arcade mode. Combines vocabulary already taught
   in Part 1 & Part 2. Does NOT modify Part 1, Part 2 or the Notebook.
   Session flow (linear, one sitting):
   1) 10-Second Flash  2) Listen & Tap  3) Find It!
   4) Sentence Race     5) True or False  6) Final Challenge
   7) Reward (Badge + Certificate + Fireworks)
   No external libraries, fonts, images or network calls.
   ============================================================ */

/* ---------------------- STATE ---------------------- */
const state = { stars:0, coins:0, name:'' };
const GAME_STAGES = ['flash','listen','findit','sentence','tf','final','reward'];
const STAGE_LABELS = { flash:'⏱️ Flash', listen:'🎧 Listen', findit:'🏫 Find It', sentence:'🧩 Race', tf:'🎯 T/F', final:'🏆 Final' };
let stageIdx = 0;

/* ---------------------- AUDIO ---------------------- */
let actx = null;
function audioCtx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function tone(freq, start, dur, type='sine', vol=.18){
  const ctx = audioCtx();
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, ctx.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+start); o.stop(ctx.currentTime+start+dur+0.05);
}
function sfxClick(){ tone(520,0,.08,'triangle',.12); }
function sfxCorrect(){ tone(523,0,.12,'sine'); tone(659,.1,.12,'sine'); tone(784,.2,.18,'sine'); }
function sfxWrong(){ tone(220,0,.15,'sawtooth',.1); tone(180,.12,.18,'sawtooth',.1); }
function sfxLevelUp(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.22,'sine',.16)); }
function sfxCoin(){ tone(988,0,.06,'square',.1); tone(1318,.06,.1,'square',.1); }
function sfxTick(){ tone(700,0,.05,'square',.06); }

let voices=[];
function loadVoices(){ voices = ('speechSynthesis' in window && speechSynthesis.getVoices) ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text, rate=0.95){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate; u.pitch = 1.15; u.lang='en-US';
  const v = voices.find(v=>/en/i.test(v.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function lumiSay(txt){ document.getElementById('lumiBubble').textContent = txt; speak(txt); }
function lumiSayQuiet(txt){ document.getElementById('lumiBubble').textContent = txt; }

/* ---------------------- FX: confetti / floating text / fireworks ---------------------- */
const fxLayer = document.getElementById('fxLayer');
const confettiColors = ['#FF6B8B','#FFC94D','#5FCB8B','#8FCBEF','#DCC8F7','#FFB870'];
function confettiBurst(n=40){
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className='confetti';
    const size = 6+Math.random()*6;
    el.style.width=size+'px'; el.style.height=(size*.6)+'px';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    el.style.animationDuration = (1.6+Math.random()*1.4)+'s';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    fxLayer.appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }
}
function floatText(txt, x, y, color='#FFC94D'){
  const el = document.createElement('div');
  el.className='floatText'; el.textContent=txt; el.style.color=color;
  el.style.left = x+'px'; el.style.top = y+'px';
  fxLayer.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}
function burstFrom(evt, txt, color){
  let x = window.innerWidth/2, y = window.innerHeight/2;
  if(evt && evt.currentTarget){ const r = evt.currentTarget.getBoundingClientRect(); x=r.left+r.width/2; y=r.top; }
  floatText(txt, x-20, y, color);
}
function fireworkAt(x,y){
  for(let i=0;i<22;i++){
    const el = document.createElement('div');
    el.className='firework';
    const angle = (Math.PI*2*i)/22;
    const dist = 50+Math.random()*70;
    el.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    el.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    el.style.left = x+'px'; el.style.top = y+'px';
    const size = 4+Math.random()*4;
    el.style.width = size+'px'; el.style.height = size+'px';
    el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    fxLayer.appendChild(el);
    setTimeout(()=>el.remove(), 950);
  }
}
function fireworksShow(){
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const x = window.innerWidth*(0.15+Math.random()*0.7);
      const y = window.innerHeight*(0.15+Math.random()*0.35);
      fireworkAt(x,y);
      tone(500+Math.random()*500, 0, .25, 'sine', .12);
    }, i*380);
  }
}

/* ---------------------- REWARD HELPERS ---------------------- */
function giveStars(n, evt){ state.stars+=n; sfxCorrect(); confettiBurst(14); burstFrom(evt, '+'+n+' ⭐', '#FFC94D'); updateHUD(); }
function giveCoins(n, evt){ state.coins+=n; sfxCoin(); burstFrom(evt, '+'+n+' 🪙', '#E39A00'); updateHUD(); }
function wrongFeedback(){ sfxWrong(); }
function updateHUD(){
  document.getElementById('statStars').textContent = state.stars;
  document.getElementById('statCoins').textContent = state.coins;
  const dots = document.getElementById('hudDots'); dots.innerHTML='';
  GAME_STAGES.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'dotPiece' + (i<stageIdx?' on':'') + (i===stageIdx?' cur':'');
    d.title = STAGE_LABELS[s]||s;
    dots.appendChild(d);
  });
}

/* ---------------------- ICON LIBRARY ---------------------- */
function badge(bg, inner){ return `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="4" y="4" width="92" height="92" rx="22" fill="${bg}"/>${inner}</svg>`; }
const ICONS = {
  school: '🏫', classroom: badge('#FFE49C', `<rect x="14" y="18" width="72" height="54" rx="6" fill="#fff" stroke="#F2C879" stroke-width="3"/><rect x="24" y="26" width="34" height="20" rx="3" fill="#2E5C4A"/><path d="M30 34 h10 M30 40 h18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><rect x="64" y="30" width="14" height="12" rx="2" fill="#8FCBEF"/><rect x="24" y="54" width="16" height="12" rx="2" fill="#FF9A45"/><rect x="46" y="54" width="16" height="12" rx="2" fill="#FF9A45"/>`),
  teacher: '🧑\u200d🏫', principal: '🧑\u200d💼',
  friend: '🧑\u200d🤝\u200d🧑', desk: '🗄️', chair: '🪑', board: badge('#DCEEF9', `<rect x="14" y="16" width="72" height="48" rx="6" fill="#fff" stroke="#5FA8DE" stroke-width="4"/><path d="M24 30 h24 M24 40 h34 M24 50 h20" stroke="#33405C" stroke-width="3" stroke-linecap="round"/><rect x="30" y="64" width="40" height="8" rx="3" fill="#C08A54"/><circle cx="38" cy="68" r="3" fill="#FF6B8B"/><circle cx="50" cy="68" r="3" fill="#5FA8DE"/><circle cx="62" cy="68" r="3" fill="#5FCB8B"/>`),
  bag: '🎒', book: '📘', pencil: '✏️', crayon: '🖍️', ruler: '📏',
  scissors: '✂️', glue: '🧴', playground: '🛝', library: '📚',
  canteen: '🍽️', bell: '🔔', star: '⭐', lumi: '🐝', seal: '🏅',
  standup: '🧍', sitdown: '🪑', listen: '👂', look: '👀',
  openbook: '📖', closebook: '📕', lineup: '🚶', quiet: '🤫', raisehand: '✋',
  one: '1️⃣', two: '2️⃣', three: '3️⃣', four: '4️⃣', five: '5️⃣',
  six: '6️⃣', seven: '7️⃣', eight: '8️⃣', nine: '9️⃣', ten: '🔟',
};
function ic(key,size=44){
  const val = ICONS[key]||ICONS.star;
  if(typeof val==='string' && val.trim().startsWith('<')){
    return `<div style="width:${size}px;height:${size}px;margin:0 auto;">${val}</div>`;
  }
  return `<span style="font-size:${size}px;line-height:1;display:inline-block;">${val}</span>`;
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------------------- VOCABULARY BANKS (from Part 1 + Part 2) ---------------------- */
const PICS = [
  {w:'school', i:'school'}, {w:'classroom', i:'classroom'}, {w:'teacher', i:'teacher'},
  {w:'principal', i:'principal'}, {w:'friend', i:'friend'}, {w:'playground', i:'playground'},
  {w:'library', i:'library'}, {w:'canteen', i:'canteen'}, {w:'desk', i:'desk'}, {w:'chair', i:'chair'},
  {w:'board', i:'board'}, {w:'bag', i:'bag'}, {w:'book', i:'book'}, {w:'pencil', i:'pencil'},
  {w:'crayon', i:'crayon'}, {w:'ruler', i:'ruler'}, {w:'scissors', i:'scissors'}, {w:'glue', i:'glue'},
];
const PLACES = [
  {w:'school', i:'school'}, {w:'classroom', i:'classroom'}, {w:'playground', i:'playground'},
  {w:'library', i:'library'}, {w:'canteen', i:'canteen'},
];
const COMMANDS = [
  {w:'stand up', i:'standup', s:'Stand up, please!'}, {w:'sit down', i:'sitdown', s:'Sit down, please!'},
  {w:'listen', i:'listen', s:'Listen, please!'}, {w:'look', i:'look', s:'Look at me, please!'},
  {w:'be quiet', i:'quiet', s:'Be quiet, please!'}, {w:'line up', i:'lineup', s:'Line up, please!'},
  {w:'raise your hand', i:'raisehand', s:'Raise your hand, please!'},
];
const NUMBERS = [
  {w:'one', i:'one'}, {w:'two', i:'two'}, {w:'three', i:'three'}, {w:'four', i:'four'}, {w:'five', i:'five'},
  {w:'six', i:'six'}, {w:'seven', i:'seven'}, {w:'eight', i:'eight'}, {w:'nine', i:'nine'}, {w:'ten', i:'ten'},
];
const SENTENCES = [
  ['This','is','my','school.'], ['This','is','my','teacher.'], ['This','is','my','friend.'],
  ['Open','your','book.'], ['Sit','down,','please!'],
];
const TF_BANK = [
  {i:'bag', text:'This is a bag.', truth:true}, {i:'bag', text:'This is a ruler.', truth:false},
  {i:'book', text:'This is a book.', truth:true}, {i:'pencil', text:'This is a crayon.', truth:false},
  {i:'chair', text:'This is a chair.', truth:true}, {i:'scissors', text:'This is glue.', truth:false},
  {i:'school', text:'This is my school.', truth:true}, {i:'classroom', text:'This is the playground.', truth:false},
  {i:'board', text:'This is the board.', truth:true}, {i:'desk', text:'This is a chair.', truth:false},
];

/* ---------------------- ENGINE ---------------------- */
const stageEl = document.getElementById('stage');
function goStage(idx){
  stageIdx = idx;
  updateHUD();
  const key = GAME_STAGES[stageIdx];
  switch(key){
    case 'flash': return renderFlash();
    case 'listen': return renderListen();
    case 'findit': return renderFindIt();
    case 'sentence': return renderSentenceRace();
    case 'tf': return renderTrueFalse();
    case 'final': return renderFinalChallenge();
    case 'reward': return renderReward();
  }
}
function nextStage(){ goStage(stageIdx+1); }

function startApp(name){
  state.name = name || 'Explorer';
  goStage(0);
}

function renderStartScreen(){

    ${ic('school',86)}

    <div class="previewRow">

    </div>

    </div>

/* ---------------------- COUNTDOWN TIMER HELPER ----------------------
   onTick(secondsLeft) / onTimeout() — used by Flash & Sentence Race.
   Always resolves positively: on timeout we simply move the child
   forward with an encouraging message, never a "fail" state. */
function runCountdown(totalSec, elId, numId, onTimeout){
  let left = totalSec;
  const fill = document.getElementById(elId);
  const num = document.getElementById(numId);
  const timer = setInterval(()=>{
    left--;
    if(fill) fill.style.width = Math.max(0,(left/totalSec)*100)+'%';
    if(num) num.textContent = Math.max(0,left)+'s';
    if(left<=3 && left>0) sfxTick();
    if(left<=0){ clearInterval(timer); onTimeout(); }
  }, 1000);
  return timer;
}

/* ---------------------- 1) 10-SECOND FLASH ---------------------- */
function renderFlash(){
  const ROUNDS = 5; let round = 0; let timer = null;
  function paint(){
    if(timer) clearInterval(timer);
    if(round>=ROUNDS){ giveStars(2); nextStage(); return; }
    const target = PICS[Math.floor(Math.random()*PICS.length)];
    const opts = shuffle([target, ...shuffle(PICS.filter(p=>p.w!==target.w)).slice(0,3)]);
    stageEl.innerHTML = `
    <div class="card center">
      <div class="scene-title">⏱️ 10-Second Flash</div>
      <div class="scene-sub">Round ${round+1} of ${ROUNDS} — tap the picture as fast as you can!</div>
      <p style="font-size:26px; font-weight:900; color:var(--ink);">${target.w}</p>
      <div class="timerWrap"><div class="timerBar"><div class="timerFill" id="flashFill"></div></div><div class="timerNum" id="flashNum">10s</div></div>
      <div class="grid cols4" id="flashGrid" style="margin-top:14px;"></div>
    </div>`;
    const grid = document.getElementById('flashGrid');
    opts.forEach(o=>{
      const t = document.createElement('div'); t.className='tile clickable'; t.innerHTML = ic(o.i,50);
      t.onclick = (e)=>{
        if(o.w===target.w){ clearInterval(timer); t.classList.add('correct'); sfxCorrect(); giveStars(1,e); round++; setTimeout(paint,600); }
        else { t.classList.add('wrong'); wrongFeedback(); setTimeout(()=>t.classList.remove('wrong'),400); }
      };
      grid.appendChild(t);
    });
    timer = runCountdown(10,'flashFill','flashNum', ()=>{
      wrongFeedback(); lumiSayQuiet("Time's up! It's OK, let's flash the next one!");
      round++; setTimeout(paint,900);
    });
  }
  paint();
  lumiSay("Look fast and tap the matching picture before time runs out!");
}

/* ---------------------- 2) LISTEN & TAP ---------------------- */

    stageEl.innerHTML = `

      <button class="btn sound" onclick="speak('${target.w}!')">🔊 Play Again</button>
      <div class="grid cols3" id="listenGrid" style="margin-top:14px;"></div>
    </div>`;
    const grid = document.getElementById('listenGrid');
    opts.forEach(o=>{

      t.onclick = (e)=>{

    const target = PLACES[Math.floor(Math.random()*PLACES.length)];
    const question = `Where is the ${target.w}?`;
    stageEl.innerHTML = `
    <div class="card center">
      <div class="scene-title">🏫 Find It!</div>
      <div class="scene-sub">Round ${round+1} of ${ROUNDS}</div>
      <p style="font-size:18px; font-weight:800;">"${question}"</p>
      <button class="btn sound" onclick="speak('${question}')">🔊 Hear Again</button>
      <div class="grid cols3" id="findGrid" style="margin-top:14px;"></div>
    </div>`;
    const opts = shuffle([target, ...shuffle(PLACES.filter(p=>p.w!==target.w)).slice(0,2)]);
    const grid = document.getElementById('findGrid');
    opts.forEach(o=>{
      const t = document.createElement('div'); t.className='tile clickable'; t.innerHTML = `${ic(o.i,50)}<div class="word">${o.w}</div>`;
      t.onclick = (e)=>{
        if(o.w===target.w){ t.classList.add('correct'); sfxCorrect(); giveStars(1,e); speak('This is the '+target.w+'.'); round++; setTimeout(paint,700); }
        else { t.classList.add('wrong'); wrongFeedback(); setTimeout(()=>t.classList.remove('wrong'),400); }
      };
      grid.appendChild(t);
    });
    speak(question);
  }
  paint();
  lumiSayQuiet("Listen to the question, then find the right place!");
}

/* ---------------------- 4) SENTENCE RACE ---------------------- */
function renderSentenceRace(){
  const ROUNDS = 3; let round = 0; let timer = null;
  const chosen = shuffle(SENTENCES).slice(0,ROUNDS);
  function paint(){
    if(timer) clearInterval(timer);
    if(round>=ROUNDS){ giveStars(2); nextStage(); return; }
    const words = chosen[round]; const bank = shuffle(words); let placed = [];
    stageEl.innerHTML = `
    <div class="card center">
      <div class="scene-title">🧩 Sentence Race</div>
      <div class="scene-sub">Sentence ${round+1} of ${ROUNDS} — build it before time runs out!</div>
      <div class="timerWrap"><div class="timerBar"><div class="timerFill" id="raceFill"></div></div><div class="timerNum" id="raceNum">20s</div></div>
      <div class="chipzone" id="raceTarget" style="margin-top:10px;"></div>
      <div class="chipzone" id="raceBank" style="margin-top:10px;"></div>
    </div>`;
    function render(){
      document.getElementById('raceTarget').innerHTML = placed.map(w=>`<span class="chip placed">${w}</span>`).join('') || '<span class="small">Tap words below in order…</span>';
      const bankEl = document.getElementById('raceBank'); bankEl.innerHTML='';
      const remaining = [...bank]; placed.forEach(w=>{ const p=remaining.indexOf(w); if(p>-1) remaining.splice(p,1); });
      remaining.forEach(w=>{
        const c = document.createElement('span'); c.className='chip bank'; c.textContent=w;
        c.onclick = ()=>{
          placed.push(w); sfxClick();
          if(placed.length===words.length){
            clearInterval(timer);
            const ok = placed.join(' ')===words.join(' ');
            setTimeout(()=>{
              if(ok){ sfxCorrect(); giveStars(1); speak(words.join(' ')); round++; setTimeout(paint,700); }
              else { wrongFeedback(); placed=[]; render(); timer = runCountdown(20,'raceFill','raceNum', ()=>timeUp()); }
            },300);
          } else render();
        };
        bankEl.appendChild(c);
      });
    }
    function timeUp(){
      wrongFeedback(); lumiSayQuiet('Time\'s up! The sentence was: ' + words.join(' '));
      speak(words.join(' ')); round++; setTimeout(paint,1300);
    }
    render();
    timer = runCountdown(20,'raceFill','raceNum', timeUp);
  }
  paint();
  lumiSay("Tap the words in the right order — quick, quick!");
}

/* ---------------------- 5) TRUE OR FALSE ---------------------- */
function renderTrueFalse(){
  const ROUNDS = 5; let round = 0;
  const chosen = shuffle(TF_BANK).slice(0,ROUNDS);
  function paint(){
    if(round>=ROUNDS){ giveStars(2); nextStage(); return; }
    const item = chosen[round];
    stageEl.innerHTML = `
    <div class="card center">
      <div class="scene-title">🎯 True or False</div>
      <div class="scene-sub">Round ${round+1} of ${ROUNDS}</div>
      ${ic(item.i,80)}
      <p style="font-size:19px; font-weight:800; margin-top:8px;">"${item.text}"</p>
      <button class="btn sound" onclick="speak('${item.text}')">🔊 Hear Again</button>
      <div class="rowbtns center" style="justify-content:center; margin-top:16px;">
        <button class="btn tf yes" id="tfYes">✅</button>
        <button class="btn tf no" id="tfNo">❌</button>
      </div>
    </div>`;
    function answer(said, evt){
      const ok = said===item.truth;
      if(ok){ sfxCorrect(); giveStars(1,evt); } else { wrongFeedback(); }
      document.getElementById('tfYes').disabled = true; document.getElementById('tfNo').disabled = true;
      lumiSayQuiet(ok ? "Correct! Great job! 🌟" : ("Almost! The right answer was " + (item.truth?'✅ True':'❌ False') + "."));
      round++; setTimeout(paint,1100);
    }
    document.getElementById('tfYes').onclick=(e)=>answer(true,e);
    document.getElementById('tfNo').onclick=(e)=>answer(false,e);
    speak(item.text);
  }
  paint();
  lumiSayQuiet("Look at the picture. Is the sentence true or false?");
}

/* ---------------------- 6) FINAL CHALLENGE (mixed) ---------------------- */
function buildFinalQuestions(){
  const vocabQs = shuffle(PICS).slice(0,2).map(t=>({type:'pic', q:'What is this?', target:t, opts:shuffle([t, ...shuffle(PICS.filter(p=>p.w!==t.w)).slice(0,2)])}));
  const listenQs = shuffle(PICS).slice(0,2).map(t=>({type:'listen', q:t.w+'!', target:t, opts:shuffle([t, ...shuffle(PICS.filter(p=>p.w!==t.w)).slice(0,2)])}));
  const sentenceQs = shuffle(SENTENCES).slice(0,2).map(words=>({type:'sentence', words}));
  const commandQs = shuffle(COMMANDS).slice(0,2).map(t=>({type:'word', q:'Tap: '+t.w, target:t.w, opts:shuffle([t.w, ...shuffle(COMMANDS.filter(c=>c.w!==t.w)).slice(0,2).map(c=>c.w)])}));
  const numberQs = shuffle(NUMBERS).slice(0,2).map(t=>({type:'pic', q:'What number is this?', target:t, opts:shuffle([t, ...shuffle(NUMBERS.filter(n=>n.w!==t.w)).slice(0,2)])}));
  return shuffle([...vocabQs, ...listenQs, ...sentenceQs, ...commandQs, ...numberQs]);
}
function renderFinalChallenge(){
  const questions = buildFinalQuestions();
  let idx = 0;
  function paint(){
    if(idx>=questions.length){ giveStars(4); giveCoins(10); nextStage(); return; }
    const q = questions[idx];
    if(q.type==='sentence'){
      const bank = shuffle(q.words); let placed = [];
      stageEl.innerHTML = `<div class="card center"><div class="scene-title">🏆 Final Challenge ${idx+1}/${questions.length}</div><div class="scene-sub">Build: "${q.words.join(' ')}"</div><div class="chipzone" id="fcTarget"></div><div class="chipzone" id="fcBank" style="margin-top:10px;"></div></div>`;
      function render(){
        document.getElementById('fcTarget').innerHTML = placed.map(w=>`<span class="chip placed">${w}</span>`).join('') || '<span class="small">Tap in order…</span>';
        const b = document.getElementById('fcBank'); b.innerHTML='';
        const rem = [...bank]; placed.forEach(w=>{ const p=rem.indexOf(w); if(p>-1) rem.splice(p,1); });
        rem.forEach(w=>{
          const c = document.createElement('span'); c.className='chip bank'; c.textContent=w;
          c.onclick = ()=>{
            placed.push(w); sfxClick();
            if(placed.length===q.words.length){
              setTimeout(()=>{
                if(placed.join(' ')===q.words.join(' ')){ sfxCorrect(); giveStars(1); idx++; paint(); }
                else { wrongFeedback(); placed=[]; render(); }
              },300);
            } else render();
          };
          b.appendChild(c);
        });
      }
      render();
    } else if(q.type==='word'){
      stageEl.innerHTML = `<div class="card center"><div class="scene-title">🏆 Final Challenge ${idx+1}/${questions.length}</div><div class="scene-sub">${q.q}</div><div class="grid cols3" id="fcGrid" style="margin-top:12px;"></div></div>`;
      const grid = document.getElementById('fcGrid');
      q.opts.forEach(w=>{
        const t = document.createElement('div'); t.className='tile clickable'; t.innerHTML=`<div class="word">${w}</div>`;
        t.onclick = (e)=>{ if(w===q.target){ sfxCorrect(); giveStars(1,e); idx++; setTimeout(paint,500); } else { wrongFeedback(); t.classList.add('wrong'); setTimeout(()=>t.classList.remove('wrong'),400); } };
        grid.appendChild(t);
      });
    } else {
      const isListen = q.type==='listen';
      stageEl.innerHTML = `<div class="card center"><div class="scene-title">🏆 Final Challenge ${idx+1}/${questions.length}</div><div class="scene-sub">${isListen?'Listen and tap!':q.q}</div>${isListen?`<button class="btn sound" onclick="speak('${q.q}')">🔊 Play Again</button>`:ic(q.target.i,80)}<div class="grid cols3" id="fcGrid2" style="margin-top:12px;"></div></div>`;
      if(isListen) speak(q.q);
      const grid = document.getElementById('fcGrid2');
      q.opts.forEach(o=>{
        const t = document.createElement('div'); t.className='tile clickable'; t.innerHTML = isListen? ic(o.i,50) : `<div class="word">${o.w}</div>`;
        t.onclick = (e)=>{ if(o.w===q.target.w){ sfxCorrect(); giveStars(1,e); idx++; setTimeout(paint,500); } else { wrongFeedback(); t.classList.add('wrong'); setTimeout(()=>t.classList.remove('wrong'),400); } };
        grid.appendChild(t);
      });
    }
  }
  paint();
  lumiSay("Final Challenge time! Show me everything you've learned!");
}
